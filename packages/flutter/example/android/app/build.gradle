plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ai.dhaam.dhaam_chat_flutter_example"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ai.dhaam.dhaam_chat_flutter_example"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // 23, not `flutter.minSdkVersion`, which is 21 on the Flutter 3.24.4
        // this repo pins (flutter_tools/gradle/src/main/groovy/flutter.groovy
        // :48 — read, not assumed).
        //
        // `record_android` 1.5.2 declares `minSdk = 23`, so leaving the
        // Flutter default here fails the manifest merge outright:
        // "uses-sdk:minSdkVersion 21 cannot be smaller than version 23
        // declared in library [record_android]". That is a build error rather
        // than a runtime one, which is the good kind — but it is a real cost
        // the voice dependency imposes on every Android host, so it is
        // written down here and in packages/flutter/README.md rather than
        // discovered by whoever runs the first Android build.
        //
        // API 23 is Android 6.0. It is also where runtime permissions were
        // introduced, which is the model `record`'s `hasPermission(request:
        // true)` relies on — so the floor and the feature arrived together.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
