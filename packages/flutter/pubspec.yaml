name: dhaam_chat_flutter
description: >-
  Flutter UI for the Dhaam chat widget — the screens, navigation and the
  remote-config fetch, built on top of the pure-Dart `dhaam_chat` client.
version: 0.1.0
publish_to: none

# Matches `dhaam_chat`'s own constraint exactly, not the higher one the
# sibling apps (dh-customer-app-flutter, dh-merchant-app-flutter) pin. This is
# a library sitting BETWEEN those apps and `dhaam_chat` — it has to build
# against whatever Dart SDK `dhaam_chat` accepts, and pinning higher than that
# for no reason this package actually needs would narrow who can depend on it
# without buying anything back. An app can afford to be conservative about
# what it requires; a library sitting in the middle should not be more
# demanding than the package right below it.
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dhaam_chat:
    path: ../dart
  # For the one HTTP call this package makes (`fetchRemoteConfig`) — see
  # `lib/src/config/remote_config.dart`. `dhaam_chat` deliberately carries no
  # HTTP dependency at all (see its README); that boundary is why the fetch
  # lives here instead. `package:http` is the Dart team's own client and ships
  # `package:http/testing.dart`'s `MockClient`, which is what lets the fetch
  # be tested without a real network and without a second test dependency.
  # https://pub.dev/packages/http (v1.6.0 current at the time of writing)
  http: ^1.6.0
  # State management: matches what dh-customer-app-flutter and
  # dh-merchant-app-flutter already standardise on (both pin flutter_bloc
  # ^9.1.1) — see this package's README for which shape (Cubit vs Bloc) is
  # used and why, and the sibling apps' own `connectivity_cubit.dart` for the
  # precedent this package follows most directly: a Cubit whose whole job is
  # mirroring an external stream into widget-renderable state.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  # For the "chat is unavailable" panel's `mailto:` link — the one place this
  # package opens anything outside its own widget tree. Both
  # dh-customer-app-flutter (^6.3.1) and dh-merchant-app-flutter (^6.3.2)
  # already depend on it, checked first per this package's own precedent (see
  # the flutter_bloc note above). ^6.3.1, not the newer sibling pin: 6.3.2
  # requires Dart SDK ^3.6.0 and `flutter pub get` here resolves Dart 3.5.4 —
  # verified by running it, not assumed — so 6.3.1 is the one both apps and
  # this package can actually share. https://pub.dev/packages/url_launcher
  url_launcher: ^6.3.1
  # The platform file chooser behind `AttachmentPicker`
  # (`lib/src/ui/attachments/`). Chosen over `image_picker` — which was the
  # other candidate — because `composer.ts`, the surface this ports, has ONE
  # attach affordance, not a photo button and a file button; `file_picker`
  # covers both a document and a gallery pick through `FileType`, while
  # `image_picker` would additionally oblige every host to declare camera
  # permission strings for a camera path the reference widget does not have.
  # A second plugin duplicating the first's capability could not be given an
  # honest rationale here, which this file requires of every entry.
  # ^11.0.3, not the newer ^12: `flutter pub get` here resolves 11.0.3 and
  # reports 12.2.0 as "incompatible with dependency constraints" — verified by
  # running it, the same way the url_launcher pin above was.
  # https://pub.dev/packages/file_picker
  file_picker: ^11.0.3
  # Resolves a picked file's media type, which `file_picker` does not report:
  # `PlatformFile` carries a name, a size and bytes, and no MIME at all.
  # Without this every Dart-originated upload would declare
  # `application/octet-stream`, the server would file it under `documents`,
  # and `normalizeMediaType` would degrade it to `DOCUMENT` — so every photo a
  # customer sends would arrive as a generic file with no thumbnail. That is
  # exactly the bug `dart_rest` accepted `http_parser` to prevent on the same
  # upload (orchestrator decision D2), and the same argument applies: the
  # Dart team's own package, pure Dart, no native code and no platform
  # channel. Its magic-number table covers only unambiguous formats (JPEG,
  # PNG, GIF, TIFF, PDF, FLAC, AAC, MP3, Ogg) and contains no container types,
  # which is what makes sniffing-before-extension safe here — audited, not
  # assumed. Requires Dart ^3.2.0, well inside the 3.5.4 this repo resolves.
  # https://pub.dev/packages/mime
  mime: ^2.0.0
  # The REST surface `dhaam_chat` deliberately does not speak. Four screens in
  # this package need it — the CSAT card (submit/lookup, close/reopen), the
  # session picker (`listSessions`), the composer (`POST /upload`) and the
  # header (transcript email, report issue) — so leaving it undeclared would
  # force each of them to invent a seam for the SAME package and oblige every
  # host to wire four of them (orchestrator decision D22).
  #
  # A path dependency, like `dhaam_chat` above: all three packages are versioned
  # and released together out of this repo, so a version constraint between two
  # of them would describe a compatibility question that cannot arise.
  #
  # The function-typed seams the widgets themselves take (`AttachmentUploader`,
  # `TranscriptEmailer`, `IssueReporter`) are NOT replaced by this: they are
  # what keeps every widget test runnable with a closure and no network. What
  # this dependency changes is only that this package may now SUPPLY the real
  # implementation instead of pushing that onto the host.
  dhaam_chat_rest:
    path: ../dart_rest
  # The durable half of `ChatStorage` (`lib/src/storage/chat_storage.dart`),
  # which is the ONE place this widget remembers a per-visitor decision:
  # whether the visitor agreed to the merchant's consent notice, and (next)
  # whether they silenced the chime. `ChatWidgetState.muted` recorded the debt
  # this pays off — "the consent gate needs the same store, under the same
  # per-publishable-key rule, and inventing a second one now would leave two
  # answers to 'where does this widget remember a per-visitor decision'".
  #
  # The Flutter team's own plugin, and the one both sibling apps already
  # carry, so this adds nothing to a host that has either. Chosen over
  # `flutter_secure_storage`, which was the other candidate: what is stored
  # here is a yes/no the visitor themselves gave, not a credential, and
  # keychain/keystore access has a real cost (a slower first read, and on some
  # Android devices a keystore that can be invalidated by a lock-screen
  # change) that would buy nothing for a boolean whose worst-case leak is that
  # somebody learns this device agreed to a privacy notice.
  #
  # ^2.5.3, not the newer ^2.5.5: `flutter pub get` here resolves 2.5.3 and
  # reports 2.5.5 as incompatible with the SDK this repo pins (Dart 3.5.4 /
  # Flutter 3.24.4) — verified by running it, the same way the url_launcher
  # and file_picker pins above were, never assumed.
  #
  # `SharedPreferencesAsync` is the API used, not the legacy `SharedPreferences`
  # class — see `SharedPreferencesChatStorage`'s own doc for the plugin's own
  # note marking that one legacy, and for why its `flutter.` key prefix is the
  # wrong thing to put in front of a per-publishable-key namespace.
  # https://pub.dev/packages/shared_preferences
  shared_preferences: ^2.5.3
  # The microphone behind `VoiceDevice` (`lib/src/ui/voice/`). Chosen over
  # `speech_to_text` — the other candidate — because it is a different
  # feature, not a wider one: `speech_to_text` transcribes and discards the
  # audio, while `ui/voice.ts`, the surface this ports, records a blob and
  # sends it down the attachment path for the agent to listen to. It would
  # also oblige every host to declare `NSSpeechRecognitionUsageDescription`
  # for a capability this port does not have, which is the same argument that
  # declined `image_picker` above and applies more strongly here.
  #
  # ^6.2.1, not the newer ^7: `flutter pub add --dry-run record` here resolves
  # 6.2.1 and reports 7.1.1 as available-but-incompatible — verified by
  # running it, the same way the url_launcher, file_picker and
  # shared_preferences pins above were. It brings seven packages: `record`
  # plus one federated implementation per platform plus the platform
  # interface.
  #
  # Deferred once, deliberately, and taken now for a reason that changed: T15
  # shipped the whole portable half behind the `VoiceDevice` seam and took no
  # plugin, because a recording had nowhere to go —
  # `AttachmentDraftController` accepted drafts only from its own picker, so
  # native capture code on six platforms would have produced bytes no
  # customer could send. `setDraft` closed that, so the output now reaches
  # the wire.
  #
  # What this costs a host, stated rather than buried: `record_ios` and
  # `record_macos` link AVFoundation, so every host must add
  # `NSMicrophoneUsageDescription` to `Info.plist` (and the
  # `com.apple.security.device.audio-input` entitlement on macOS), and
  # Android needs `RECORD_AUDIO` — see this package's README and
  # `example/`, which carries exactly those entries and no invented ones.
  #
  # Capture goes through `startStream`, not `start(path:)`, and the choice is
  # forced: the file path is documented as "Required on all IO platforms", so
  # reading the bytes back would need `dart:io` and this package would stop
  # compiling for web (nothing in `lib/` imports it today). Stream mode's only
  # encoder available on all six platforms is `pcm16bits` — checked against
  # the package's own parity matrix, where `aacLc` is absent for web, Windows
  # and linux — so `lib/src/ui/voice/wav.dart` writes the 44-byte WAVE header
  # that turns those samples into a file an agent can actually open.
  # https://pub.dev/packages/record
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Only for unavailable_view_test.dart's UrlLauncherPlatform fake — the
  # plugin's own documented test seam (its `instance` setter exists so
  # platform calls can be swapped out under test). A direct dev dependency
  # rather than relying on it transitively through url_launcher: it is
  # imported by name in test code, and pinning it to what url_launcher
  # ^6.3.1 already resolves (2.3.2) is what keeps that import honest.
  url_launcher_platform_interface: ^2.3.2
  # Only for chat_storage_test.dart's in-memory preference store — the
  # plugin's own documented test seam (`SharedPreferencesAsyncPlatform.instance`
  # exists so platform calls can be swapped out under test), exactly the shape
  # url_launcher_platform_interface is used in above. A direct dev dependency
  # rather than relying on it transitively through shared_preferences: it is
  # imported by name in test code, and pinning it to what
  # shared_preferences ^2.5.3 already resolves (2.4.1) is what keeps that
  # import honest.
  shared_preferences_platform_interface: ^2.4.1
  # Matches the sibling apps' lint package (they use flutter_lints ^5.0.0);
  # `dhaam_chat` uses plain `lints` because it has no Flutter to lint against.
  flutter_lints: ^5.0.0
