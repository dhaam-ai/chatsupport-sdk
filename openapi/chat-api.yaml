openapi: 3.1.0
info:
  title: Chat SDK v2 REST API
  version: 1.0.0
  summary: >-
    REST surface for chat-service: secret-key token minting, session
    lifecycle, message history, attachment upload, and outbound webhooks.
  description: |
    ## Scope and relationship to the WebSocket protocol

    This document is the **source of truth** for chat-service's REST surface.
    It is consumed two ways: (1) generated into Python and Go backend clients
    (plan task T19), and (2) hand-consumed by `@dhaam-ccrm/node` (plan task
    T16) for token minting and webhook verification. It is versioned
    independently of the `@dhaam-ccrm/*` npm package line — `1.0.0` here means
    "first stable release of this HTTP API," not "chat SDK v2."

    The realtime WebSocket frame protocol (envelope, frame-type catalog,
    `ErrorCode` enum) is specified separately in `packages/core/src/protocol`
    (plan task T1) and is referenced here only in prose — no WS frames are
    defined in this file. Several REST endpoints below exist specifically
    because backend SDKs (Python/Go, generated from this spec) are
    request/response clients with **no WebSocket connection at all** — they
    need a REST-only path to everything a browser client can also reach over
    the socket. A browser-side `@dhaam-ccrm/core` client may get some of this
    same data for free via the WS `connection.ack` snapshot; that overlap is
    intentional, not a design mistake.

    **Known gap, out of scope for this revision:** chat-service-node also
    exposes a substantial agent/staff surface (`/agent/...`, ~13 operations)
    and an admin-only surface (`/admin/...`, ~14 operations) under this same
    `/chat-services/api/v1` prefix (`src/api/rest/routes/agent.routes.ts`,
    `admin.routes.ts`). Neither is documented anywhere in this file. This was
    flagged by the SDK↔backend contract audit that produced the corrections
    below, and is noted here so it stays a tracked gap rather than a silent
    one. **Also undocumented, as of this revision**: the five base Contacts
    CRM routes (`GET /contacts`, `GET /contacts/:id`, `POST /contacts`,
    `GET /contacts/cities`, `GET /contacts/tags` —
    `src/api/rest/routes/contact.routes.ts`). This revision adds four
    `/contacts`-prefixed operations (commerce events and cart reads, tag
    `Contacts` below) without adding those five — see "Contacts /
    commerce-events surface" further down for why, so a reader does not
    infer contact CRUD is now covered just because part of `/contacts` is.

    ## Response shape

    **Corrected.** Every route below that a browser client actually calls
    wraps its `2xx` body in `{ success: true, data: {...} }` — the v1
    envelope this document previously claimed v2 had dropped. It has not
    been dropped: `src/api/rest/routes/chat.routes.ts` builds every success
    reply as `reply.send({ success: true, data: ... })` (session create at
    line 215, session list at 238, full session at 256, message history at
    276, close at 289, reopen at 310), and
    `src/api/rest/routes/upload.routes.ts` does the same at line 165. A
    generated client must unwrap `.data`, not deserialize the body directly
    into the resource type.

    **The one exception is `POST /tokens`.** That route deliberately replies
    with the resource directly on success (`{accessToken, expiresIn}`, no
    envelope — `token.routes.ts:260`) and its own header comment says so
    explicitly (`token.routes.ts:12-16`). This is safe to keep as the one
    unenveloped route precisely because it is **server-to-server only** —
    called by the customer's own backend with a secret key, never by a
    browser (see `securitySchemes.secretKey` below) — so no browser-facing
    generated client ever has to special-case it.

    Error bodies are a separate question from success envelopes and do
    **not** all carry `success: false` either — see "Error taxonomy" below
    for why, and for which layer of chat-service produces which shape.

    ## Path prefixes

    Every path below is relative to the `servers` block's
    `{apiUrl}/chat-services/api/v1` base, but the customer session/message
    routes carry an EXTRA literal `/chat` segment that the other two route
    groups do not:

    - `chat.routes.ts` is registered at the same `/chat-services/api/v1`
      prefix as everything else (`src/api/rest/server.ts:193`), but every
      route inside that file is declared with `/chat/...` baked into its
      own path string — e.g. `server.post('/chat/sessions', ...)` at
      `chat.routes.ts:190`. A previous revision of this document modeled
      these routes as `POST /sessions`, `GET /sessions/{sessionId}/full`,
      etc., omitting that segment entirely; every such request 404s against
      the real service, because no route without `/chat` exists in this
      file.
    - `POST /upload` (see below) and `POST /tokens` carry **no** such
      segment — their route strings are literally `/upload`
      (`upload.routes.ts:82`) and `/tokens` (`token.routes.ts:131`),
      registered at the bare service prefix.

    ## Auth model — one consistent scheme, replacing v1's three

    v1 mixed three different auth conventions across its own surface (PRD
    §12.6): REST used `Authorization: Bearer` **+** `X-Tenant-ID`; the
    WebSocket used a `tenantId` **query parameter** instead of a header; and
    the file-upload endpoint sent `Authorization: Bearer` with **no** tenant
    identification at all. v2 fixes this with exactly one REST convention,
    applied to every browser-facing endpoint with no exceptions:

    - `Authorization: Bearer <accessToken>` — the short-lived JWT minted by
      `POST /tokens` (PRD §10.3) and supplied to the SDK via `getToken()`
      (PRD §6.1, §10.4). Encodes the authenticated end user and their tenant.
    - `X-Publishable-Key: dhp_live_...` / `dhp_test_...` — identifies the
      tenant. Required on every request alongside the access token. The
      server rejects a request whose `X-Publishable-Key` tenant does not
      match the `accessToken`'s tenant claim with `AUTH_INVALID` — the exact
      wrong-tenant rejection behavior PRD §10.2 specifies for the WS
      handshake, applied identically here so the two transports share one
      auth story instead of two.

    **One documented exception: `POST /upload`.** It requires only
    `Authorization: Bearer <accessToken>` — it does **not** check
    `X-Publishable-Key` at all (`upload.routes.ts:86-92`; the route's own
    header comment, lines 22-31, explains why: `createCustomerAuth`'s
    combined check was rejected because the SDK does not send a publishable
    key on this call, and requiring one here would break every upload).
    Tenant scoping for the upload still comes entirely from the verified
    token, never from a header or the caller — see the `/upload` operation
    below.

    Per PRD §10.1, a publishable key **identifies a tenant and grants nothing
    on its own** — it is not a bearer credential and never appears alone in a
    `security` requirement below. This also replaces v1's raw `X-Tenant-ID`
    (an internal tenant identifier exposed to the browser) with an opaque,
    rotatable, browser-safe key, closing the "don't expose internal IDs"
    gap at the same time as the auth-consistency gap.

    The WebSocket transport (T1) is expected to carry the equivalent of these
    same two credentials in `connection.hello.d` (`publishableKey` and the
    access token) rather than v1's ad hoc query-string `tenantId` — see PRD
    §10.2. That frame contract is out of scope for this document; it is
    referenced here only so the two transports are visibly using one model,
    not two.

    ### The two key types are never interchangeable

    - **Secret key** (`dhk_live_...` / `dhk_test_...`) is valid in exactly
      three places in this whole system, as of this revision: as the
      `Authorization: Bearer` credential on `POST /tokens`, as that same
      credential on `POST /contacts/commerce-events` (added this revision —
      see `securitySchemes.secretKey` and "Contacts / commerce-events
      surface" below for exactly what that route does and does not unlock),
      and as the HMAC signing key for webhook signature verification
      (below). It is never a valid credential on any endpoint a browser
      calls, and it never leaves the customer's own backend (PRD §10.1,
      §10.7, §14).
    - **Publishable key** (`dhp_live_...` / `dhp_test_...`) identifies a tenant
      and, per PRD §10.1, grants nothing by itself — every browser-facing
      endpoint below requires it *together with* a valid `accessToken`, never
      in place of one.

    ## Read-state model — REST is read-only here (mostly)

    `GET /chat/sessions/{sessionId}/full` exposes each participant's read
    watermark (`participants[].lastReadAt`) — the same watermark model PRD
    §9.5 confirms already exists in v1. **Advancing** that watermark was
    designed to be a WebSocket-only write path in v2 (`message.markRead`),
    and an earlier revision of this section claimed the backend
    "intentionally contains no REST endpoint for advancing a read
    watermark." **That claim is false as deployed**: `chat.routes.ts` still
    exposes `POST /chat/sessions/{sessionId}/read` (lines 317-329, validated
    body `{}` — the reader is always the authenticated caller, never a body
    field), which does advance the watermark over REST, exactly as v1 did.
    `@dhaam-ccrm/core` does not call it — it uses the WS `message.markRead`
    frame as designed — so this is a live, unused-by-the-browser-SDK route
    rather than a documented one. It is noted here so a backend
    (non-WebSocket) SDK generated from this spec knows it exists, even
    though no operation for it is modeled below — formally documenting it is
    out of scope for this revision (same class of gap as the agent/admin
    note above).

    ## Error taxonomy

    Every non-2xx response body has exactly one shape (`#/components/schemas/Error`),
    reusing the **same** `ErrorCode` enum and `{ code, message, retryable,
    details? }` payload shape the WS `error`/`ack` frames use (PRD §7.2,
    §7.4) — one canonical error model across both transports, per decision
    D4's "one canonical name per concept."

    | Code | Typical HTTP status | Retryable? | Meaning |
    |---|---|---|---|
    | `VALIDATION_FAILED` | 400, 413, 415 | No | Request body/query/multipart failed schema or semantic validation (includes oversized or wrong-mime-type attachments, and invalid state-transition requests such as reopening a non-closed session). |
    | `AUTH_INVALID` | 401 | No | Missing, malformed, revoked, or wrong-tenant credential (secret key, publishable key, or access token). Mirrors the WS handshake rejection in PRD §10.2. |
    | `AUTH_EXPIRED` | 401 | Yes, after refresh | The `accessToken` has expired. Distinguished from `AUTH_INVALID` so a client can trigger `getToken()` and retry rather than treating it as a hard failure (PRD §10.6, replacing v1's `message.toLowerCase().includes('expired')` string match). |
    | `SESSION_NOT_FOUND` | 404 | No | The session does not exist, or is not visible to the authenticated caller. Returned instead of `403` for sessions the caller doesn't own, to avoid confirming they exist. |
    | `SESSION_CLOSED` | ~~409~~ **400** | No | The action is not permitted because the session is in `CLOSED` status. **Backend deviation**: `SessionClosedError` is constructed with HTTP 400, not the conventional 409 an earlier revision of this table claimed (`shared/utils/error-handler.ts:82-87`, `SessionClosedError extends AppError` with `statusCode: 400`). Documented as it actually behaves. |
    | `RATE_LIMITED` | 429 | Yes, after `Retry-After` | Too many requests for this credential. See rate-limit headers below. |
    | `PROTOCOL_VERSION_UNSUPPORTED` | — | — | WS-only (protocol version negotiation happens on `connection.hello`, not over REST). Included here only so the enum is identical across both transports; no REST endpoint returns it. |
    | `INTERNAL` | 500, 503 | Yes (`retryable` field authoritative) | Unexpected server-side fault or an unavailable downstream dependency. |

    ### Two vocabularies in practice — a real, uncorrected inconsistency

    The table above is the v2 `ErrorCode` enum (`components/schemas/ErrorCode`),
    and it genuinely is what `customer-auth.middleware.ts` (auth/tenant
    rejections) and `rate-limit.ts` (429s) emit on the customer surface —
    both call `errorPayload()` from `api/websocket/v2/protocol/build.ts`,
    the same function the WebSocket transport uses, so those two failure
    classes really do share one vocabulary across both transports as
    designed.

    Everything else a customer-facing request can fail on — `validate()`'s
    zod rejections and every domain error thrown by the service layer
    (`chat-session.service.ts`, `message.service.ts`) — is caught by the
    **global Fastify error handler** (`middleware/error-handler.ts:29-38`)
    and formatted from a **second, older vocabulary**
    (`shared/constants/index.ts` `ERROR_CODES`, lines 106-121) that was
    never reconciled with the table above. Both are real, both are
    reachable from the exact same `chat.routes.ts` operations, and a client
    has to handle both:

    | This document's `ErrorCode` | Legacy `ERROR_CODES` actually thrown by `chat.routes.ts`'s validation/service layer | Note |
    |---|---|---|
    | `VALIDATION_FAILED` | `VALIDATION_ERROR` | Every `validate()` failure on the customer surface throws `ValidationError` (code `VALIDATION_ERROR`), never `VALIDATION_FAILED` — `validate.ts:16-26`. |
    | `INTERNAL` | `INTERNAL_ERROR` | Any uncaught service-layer error. |
    | `SESSION_NOT_FOUND` | `SESSION_NOT_FOUND` | Same string in both vocabularies — no mismatch here. |
    | `SESSION_CLOSED` | `SESSION_CLOSED` | Same string in both — see the corrected HTTP status above. |
    | *(no v2 equivalent)* | `UNAUTHORIZED` | Emitted by the **agent** surface's `authenticateAgent` (`auth.middleware.ts`), not the customer surface — listed here as the same class of drift, not because a customer request can receive it. |
    | *(no v2 equivalent)* | `INVALID_TOKEN`, `INVALID_TENANT_ID`, `MESSAGE_TOO_LONG`, `BOT_SERVICE_ERROR`, `TICKET_SERVICE_ERROR`, `USER_SERVICE_ERROR`, `DATABASE_ERROR`, `NOT_FOUND` | Defined in `ERROR_CODES` and reachable from some service-layer path; not individually traced to a specific customer-facing operation by this audit. |

    The failure *shape* also differs by which layer rejected the request.
    Auth/rate-limit rejections (v2 vocabulary) reply
    `{ error: { code, message, retryable } }` with **no** `success` key
    (`customer-auth.middleware.ts:132-134`, `rate-limit.ts:108`). Everything
    the global handler formats (legacy vocabulary) replies
    `{ success: false, error: { code, message, details? } }` — **`retryable`
    is never present**. `ErrorPayload.retryable` below is therefore
    documented as optional, not required as an earlier revision of this
    schema claimed; a consumer must treat its absence as "unknown," not
    "false."

    ## Idempotency

    **Not implemented anywhere in the deployed backend**, despite an earlier
    revision of this document. No route reads or stores an
    `Idempotency-Key` header: `upload.routes.ts`, `chat.routes.ts`'s
    create/reopen handlers, and `token.routes.ts` were all read in full for
    this correction, and none of them contain any such logic. The parameter
    and every per-operation "supports `Idempotency-Key`" claim have been
    removed from the operations below rather than left describing behavior
    that does not exist.

    What genuinely IS idempotent, as an accident of the domain logic rather
    than a designed idempotency-key mechanism:

    - `POST /chat/sessions` (`createSession`): reuses an existing active
      session for the (tenant, customer) pair instead of creating a second
      one (`chat-session.service.ts:42-72`) — session-level, not
      request-level; two genuinely different create attempts still collapse
      onto the same session, which is a property of the domain, not a
      replay-safety mechanism.
    - `POST /chat/sessions/{sessionId}/close` is naturally idempotent —
      closing an already-`CLOSED` session re-runs the same status
      transition and returns `200` with the same shape, not an error.
    - `POST /chat/sessions/{sessionId}/reopen` also converges rather than
      erroring, but not for the reason previously documented here — see
      that operation's own description below.
    - `POST /tokens` has no persisted side effect to de-duplicate — minting
      is a pure function of credentials plus claims, so retries are
      inherently safe (unchanged from the previous revision).

    ## Pagination

    `GET /chat/sessions/{sessionId}/messages` uses v1's proven
    backward-cursor shape (PRD §12.10): `before` is an opaque message id,
    `limit` bounds the page, and the response carries `hasMore` — there is
    no forward cursor, because new messages arrive over the WebSocket, not
    by polling this endpoint.

    ## Rate limiting

    `RateLimit-Limit` / `RateLimit-Remaining` / `RateLimit-Reset` headers
    are carried by the customer chat surface (`/chat/sessions/...`,
    `chat.routes.ts`'s `throttle.limitIdentity` preHandler) and by
    `POST /tokens` (its own per-key limiter, `token.routes.ts:179-181`).
    **Not every response carries them**, contrary to an earlier revision of
    this section: `POST /upload` has no rate limiting wired at all (no
    throttle hooks are registered in `upload.routes.ts`), and neither do the
    undocumented agent/admin surfaces noted above. Numeric ceilings are not
    fixed by this document; see the T2 handoff's Open Questions.

    ## Webhook delivery contract

    Every webhook event body shares the same four top-level fields: `id`
    (unique per event; also sent as the `X-ChatSDK-Webhook-Id` header — use
    it for de-duplication, since delivery is at-least-once), `type` (a
    literal string constant, also sent as `X-ChatSDK-Event-Type`),
    `createdAt` (ISO-8601), and `tenantId`. Unlike browser-facing REST
    responses elsewhere in this document, `tenantId` is the raw tenant
    identifier here — webhooks are a server-to-server channel to the
    customer's own trusted backend, not a browser, so exposing it is
    appropriate even though it is deliberately withheld from browser-facing
    payloads (which identify tenant only via the opaque publishable key).
    See `X-ChatSDK-Signature` (in each webhook operation's parameters) for
    the signing/verification contract, and `X-ChatSDK-Webhook-Attempt` for
    retry semantics. The event catalog below (four events, mirroring a
    subset of the WS server-push frame catalog in T1) is a reasoned starting
    set, not a PRD-mandated list — see this document's handoff notes. New
    event types are additive and never remove or repurpose an existing one.

    ## Observability

    Every response — success or error — carries `X-Request-Id`, generated
    server-side unless the caller supplies one on the request, and every
    error body echoes the same value as `error.details.requestId` for
    support correlation.

    ## Contacts / commerce-events surface

    This revision adds the four `/contacts/...` operations below — two
    write paths that ingest order/cart events (one machine, one admin/CRM
    correction) and two admin read paths that segment carts for win-back
    campaigns. They are the first `/contacts`-prefixed operations this
    document has ever modeled.

    **This does not mean `/contacts` is now a documented surface.** The
    five base Contacts CRM routes — `GET /contacts`, `GET /contacts/:id`,
    `POST /contacts`, `GET /contacts/cities`, `GET /contacts/tags`
    (`src/api/rest/routes/contact.routes.ts`) — are untouched by this
    revision and remain undocumented, joining `/agent/...` and
    `/admin/...` in the known-gap note above. A reader should not infer
    contact CRUD is covered just because commerce events and cart reads
    now are; documenting the base five is separate, unstarted work.

    **Envelope.** All four operations below reply in the v1 `{ success,
    data }` family — like `/chat/sessions/...` and `/upload`, and
    *unlike* `POST /tokens`'s bare `{accessToken, expiresIn}` — because
    they are modeled as part of the Contacts CRM API, not the
    token/session surface. Their error bodies are `{ success: false,
    error: { code, message, details? } }`: the **legacy** vocabulary the
    global Fastify error handler produces (`middleware/error-handler.ts`),
    the same shape `POST /chat/sessions` falls back to for
    validation/domain errors — see "Error taxonomy" → "Two vocabularies in
    practice" above. It is **not** this document's `ErrorCode`/
    `ErrorPayload` bare-envelope shape, and `retryable` is never present.
    New codes this revision adds to that legacy vocabulary: `AUTH_INVALID`
    (the secret-key route's one generic auth-failure code — deliberately
    given the same NAME as this document's own `ErrorCode.AUTH_INVALID`,
    even though it rides in the legacy envelope here rather than the bare
    one; one canonical name per concept, per decision D4, extended across
    the two vocabularies rather than inventing a second name for the same
    failure), `CONTACT_NOT_FOUND`, `CART_NOT_FOUND`, and
    `INVALID_CART_TRANSITION`. See `ContactsErrorCode`.

    **No `X-Request-Id` guarantee.** The "Observability" claim just above
    — every response carries `X-Request-Id`, every error echoes it as
    `error.details.requestId` — does not hold for this route family.
    `middleware/error-handler.ts` neither sets an `X-Request-Id` response
    header nor injects `requestId` into `error.details` (confirmed absent
    from `src/`; the guarantee is real for the v2 vocabulary's
    `errorPayload()` builder, not for the global handler these four
    operations go through). A caller correlating support requests for
    these operations needs its own client-side id.

    **Idempotency, and rejection recovery.** Both write operations below
    (`recordCommerceEvent`, `recordCommerceEventForContact`) share one
    idempotency contract, keyed on the caller-supplied `eventId`, applied
    inside a single database transaction per event — proved against real
    Postgres, including the failure case below, before this contract was
    pinned:

    - Retrying an event that was **accepted and applied** on its first
      attempt (`200`, `applied: true`) with the same `eventId` returns
      `200` again with `applied: false` and the ORIGINAL outcome, re-read
      from the stored idempotency row rather than recomputed. The
      mutation is never re-applied.
    - An event that is **rejected** (`404 CART_NOT_FOUND` or
      `422 INVALID_CART_TRANSITION`) rolls back its entire transaction,
      including the idempotency insert — no row is left behind. The
      `eventId` is therefore **not consumed by a rejection**: retrying the
      identical request with the same `eventId` later is processed as a
      completely fresh attempt, never short-circuited as a replay. This is
      the intended recovery path for out-of-order arrival — e.g. a
      `cart.abandoned` that races ahead of the `cart.updated` that would
      have created its cart gets a `404` immediately, and the caller
      simply retries that same `eventId` once the earlier event has
      landed; no new id needs to be minted, and there is no case where a
      caller is stuck permanently retrying a request that can never
      succeed under its original id.
    - `400`/`401`/`403` responses happen even earlier — before any
      transaction opens at all, since bad input or a bad credential never
      reaches the idempotency check — so those were never in question:
      fix the request and retry with the same `eventId` freely.

    **Request size.** `cart.updated`'s `items` array (up to 500 entries,
    each with a `name` up to 300 characters and a `sku` up to 64 — see
    `CommerceCartItem`) is not a small body in the worst case: non-ASCII
    product names push a maximal request well past what a token-minting-
    sized limit would allow. Both write operations below accept a request
    body up to **1 MiB** (Fastify 5's own default), not the 16 KiB
    `POST /tokens` enforces — sized from the real worst case, not assumed
    from the ASCII one.
  license:
    name: Proprietary
    identifier: "UNLICENSED"
tags:
  - name: Tokens
    description: Secret-key JWT minting, called only by the customer's own backend (PRD §10.3).
  - name: Sessions
    description: Chat session lifecycle — create, fetch full state, close, reopen (PRD §6.2, §12.5).
  - name: Messages
    description: Cursor-paginated message history (PRD §6.3, §12.10).
  - name: Attachments
    description: Two-step upload-then-announce attachment flow (PRD §6.3, §12.10).
  - name: Contacts
    description: >-
      Commerce-event ingestion and cart segmentation for the Contacts CRM.
      Only these four operations are documented as of this revision — the
      five base Contacts CRUD routes remain a known gap; see "Contacts /
      commerce-events surface" in this document's top-level description.

servers:
  - url: "{apiUrl}/chat-services/api/v1"
    description: >-
      Base URL is a deployment-specific chat-service origin, supplied by the
      SDK consumer as `ChatClientConfig.apiUrl` (PRD §6.1) — there is no
      single fixed multi-tenant SaaS domain to hardcode. No port-swap
      heuristics are used to derive this from a WebSocket URL or vice versa
      (PRD §12.7, an explicitly-rejected v1 anti-pattern); `apiUrl` and
      `wsUrl` are independent, explicit configuration values.

      The `/chat-services/api/v1` path is not decoration: every route on the
      service is mounted under it (`src/api/rest/server.ts`), and the v2
      WebSocket endpoint sits at `/chat-services/v2/ws` for the same reason.
      This block previously resolved to `{apiUrl}/v1`, which would have made
      every client generated from this spec (T19) request a path the service
      does not serve.
    variables:
      apiUrl:
        default: https://api.chatsdk.example.com
        description: Deployment-specific chat-service origin (scheme + host, no trailing slash, no path segment).

paths:
  /tokens:
    post:
      operationId: mintToken
      tags: [Tokens]
      summary: Mint a short-lived, scoped user access token.
      description: |
        Called by the **customer's own backend** using their `dhk_live_...` /
        `dhk_test_...` secret key — never by a browser (PRD §10.3). The
        customer's frontend calls *their own* backend endpoint (commonly
        one they name `/token` or similar), which in turn calls this
        endpoint and relays only the resulting `accessToken` to the
        frontend, which supplies it to the SDK via `getToken()` (PRD §6.1,
        §10.4).

        Idempotency: N/A — minting has no persisted side effect to
        de-duplicate. Each call mints a fresh, independent token; retrying
        after a timeout is always safe.

        **Open Question (PRD §18 Q6, unresolved):** whether this endpoint
        should also absorb v1's separate, hardcoded external identity-mapping
        call (`mapCustomer()` → `https://docs-dev.dhaamai.com/customers/map`,
        PRD §12.6) so that v2 clients make one identity-related network call
        instead of two. This spec models the contract as it stands today
        (claims in, token out) and does **not** invent an absorbed
        identity-mapping shape pending that decision.
      security:
        - secretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintTokenRequest"
            examples:
              minimal:
                summary: Minimal request
                value:
                  userId: "cust_8f2a1e"
              withCustomClaims:
                summary: With optional profile fields and a custom claim
                value:
                  userId: "cust_8f2a1e"
                  name: "Priya Shah"
                  email: "priya@example.com"
                  planTier: "enterprise"
      responses:
        "201":
          description: Token minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintTokenResponse"
              examples:
                default:
                  value:
                    accessToken: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjdXN0XzhmMmExZSJ9.signature"
                    expiresIn: 3600
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /chat/sessions/customer:
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List the authenticated customer's recent sessions.
      description: |
        **Path corrected**: the real route is `GET /chat/sessions/customer`,
        registered ahead of `/chat/sessions/:sessionId` so Fastify's static
        route wins (`chat.routes.ts:229`, comment: "registered before
        /:sessionId (static wins in Fastify)"). An earlier revision of this
        document modeled this as `GET /sessions`, which does not exist —
        `chat.routes.ts` has no bare `GET /chat/sessions` handler at all.

        Hydrates `ChatState.pastSessions` (PRD §6.4) — the SDK's "your last
        N conversations" picker. **`@dhaam-ccrm/core` does not call this
        operation as of this revision** — `ChatState.pastSessions` is
        declared and initialized empty but nothing in `packages/core`
        populates it (confirmed gap, contract audit finding; unchanged by
        this revision, which corrects the backend response shape this
        operation will be consumed against, not the SDK wiring).

        Ordered most-recent-first (by last activity, not `createdAt`).
        Includes closed sessions — a customer reopening an earlier
        conversation (PRD §12.5) needs to see them.

        **Guests get `[]`, not an error.** A session is returned only for a
        caller the backend has identified — see `handledBy`'s sibling note
        on `ChatSessionSummaryWire` for what "identified" means here and its
        documented failure mode. This is a 200 in every case; there is no
        403/404 branch on this operation for an anonymous caller.

        **Response shape corrected as of this revision** — see
        `ChatSessionSummaryWire` / `SessionSummaryPageWire` below. The
        `sessions[]` item shape is now field-for-field the SDK's
        `ChatSessionSummary` (`packages/core/src/state/types.ts:223-240`),
        plus `handledBy`.
      security:
        - accessToken: []
          publishableKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of sessions to return. **Default corrected to 5**
            (was 6) as of this revision — `customerSessionsQuerySchema`
            (`chat.validator.ts:52-58`). BREAKING for anything hardcoding the
            old default, but this operation has zero callers (see above), so
            there is no consumer to coordinate the change with. The cap
            stays 20, unrelated to the default and unchanged.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: A page of session summaries, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/SessionSummaryPageWire"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /chat/sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create a new chat session for the authenticated customer.
      description: |
        **Path corrected**: `POST /chat/sessions`, not `POST /sessions`
        (`chat.routes.ts:190`).

        Starts a new session, defaulting to `mode: BOT` and `status: OPEN`
        (PRD §12.5's observed lifecycle). The caller's identity comes
        entirely from the validated `accessToken` — the request body carries
        only optional client-side context, never customer identity fields.

        **Open Question (not resolved by the PRD):** whether
        `@dhaam-ccrm/core` should ever call this directly, or whether
        session bootstrap stays entirely WebSocket-driven
        (`connection.ack`). As of this revision, core does not call it —
        confirmed by the contract audit that produced this correction.

        **Response shape corrected**: the actual `201` body is
        `SessionMutationResult` (`{sessionId, status, mode}`, raw integer
        enum codes) — **not** the full `ChatSession` this operation
        previously promised. `chat.routes.ts:215-218` builds the reply from
        exactly those three fields off `chatSessionService.createSession()`'s
        return value; no other field is ever included.

        **No `Location` header is set.** An earlier revision of this
        document documented one on the `201`; the handler never calls
        `reply.header('Location', ...)`, so it has been removed rather than
        left describing a response the backend does not send.

        **`Idempotency-Key` is not implemented** — see "Idempotency" above.
        What IS true: a customer with an already-active session gets that
        session back unchanged rather than a second one
        (`chat-session.service.ts:42-72`), which is a property of the
        domain (one active session per customer), not of a request replay
        key.
      security:
        - accessToken: []
          publishableKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created (or the caller's existing active session, returned unchanged).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/SessionMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /chat/sessions/{sessionId}/full:
    get:
      operationId: getSessionFull
      tags: [Sessions]
      summary: Fetch full session state — session, participants (with read watermarks), and the most recent page of messages.
      description: |
        **Path corrected**: `GET /chat/sessions/{sessionId}/full`
        (`chat.routes.ts:242`).

        Generalizes v1's `GET /sessions/{id}/full` (PRD §12.9, §12.10): each
        entry in `participants[]` carries `lastReadAt`, and a customer
        widget seeds its "seen" UI from the **maximum** `lastReadAt` across
        all `AGENT` participants (defending against multi-agent sessions).

        `messages` is the most recent page (see `messageLimit`), returned
        in ascending chronological order (oldest first). Use
        `GET /chat/sessions/{sessionId}/messages` with `before` to page
        further back.

        **Message shape corrected**: `messages[]` in the real response is
        `ChatMessageWire`, not the normalized `ChatMessage` — see that
        schema for the two concrete deviations (raw integer enum codes,
        unlifted `metadata.attachment`) and for how `@dhaam-ccrm/rest`
        normalizes them. `session`'s own `status`/`mode` are also raw
        integers on this path, and its `assignedAgent`/`customer` profile
        objects are missing `participantId`
        (`chat-user.service.ts:189-231`'s enrichment never sets it) — noted
        here as a known, separately-tracked gap not fully re-modeled in
        this revision.
      security:
        - accessToken: []
          publishableKey: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - name: messageLimit
          in: query
          required: false
          description: >-
            **Parameter name and bounds corrected** — the real query
            parameter is `messageLimit`, not `limit`
            (`fullSessionQuerySchema`, `chat.validator.ts:44-46`), capped at
            200 with a default of 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Full session state.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/SessionFullWire"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /chat/sessions/{sessionId}/messages:
    get:
      operationId: listSessionMessages
      tags: [Messages]
      summary: Cursor-paginated message history, walking backward from a given message.
      description: |
        **Path corrected**: `GET /chat/sessions/{sessionId}/messages`
        (`chat.routes.ts:262`). This is the endpoint at the center of the
        "message history not appearing after reload" defect this
        correction pass exists to close — see `ChatMessageWire` below for
        exactly what it returns and why an earlier version of
        `@dhaam-ccrm/rest` could not render it correctly even once the path
        itself was fixed.

        Matches v1's proven pagination shape (PRD §12.10, §6.3): opaque-id
        backward cursor (`before`), a `limit`, and a `hasMore` boolean in
        the response — confirmed unchanged from this document's original
        design (`listMessagesQuerySchema`, `chat.validator.ts:39-42`).
        There is no forward cursor — live messages arrive over the
        WebSocket (`message.new`), not by polling this endpoint. Omit
        `before` to fetch the most recent page.

        Returned in ascending chronological order (oldest first) —
        confirmed: the repository queries `createdAt desc` and the service
        reverses the slice before returning it
        (`message.repository.ts:174-187`, `message.service.ts:290`) — so
        the oldest message in the response is the one immediately following
        the given `before` cursor, and a client can prepend the page
        without re-sorting.

        **Message shape corrected**: the response's `messages[]` is
        `ChatMessageWire`, not the normalized `ChatMessage`. Two concrete
        deviations, both confirmed against `message.service.ts:285-296`
        and `:470-482` (`getMessages`/`getMessagesPaginated`, which return
        Prisma rows verbatim — neither method touches `metadata` or
        converts an enum):

        1. `senderType` and `messageType` are raw integer codes
           (`shared/constants/enums.ts:29-44`), not string enum names. Only
           the WebSocket path's `projectMessage`
           (`api/websocket/v2/projection.ts:81-82,205-206`) converts these;
           this REST path never does.
        2. `attachment` is never present at the top level. When a message
           carries one, it is nested at `metadata.attachment`
           (`api/websocket/v2/projection.ts:213-220`'s own comment: "the
           database keeps attachments inside the legacy `metadata`
           column" — that comment describes the persistence layer this
           REST path reads from directly, unprojected).

        `@dhaam-ccrm/rest`'s `createHistorySource` adapter converts every
        row of this shape into the normalized `ChatMessage` (int→string
        lookup, and lifting/stripping `metadata.attachment`) before handing
        it to `@dhaam-ccrm/core` — this is now implemented (see
        `packages/rest/src/projection.ts`). This schema exists so that
        normalization step stays visible and is never "corrected" back out
        under the assumption that the wire already matches `ChatMessage`.
      security:
        - accessToken: []
          publishableKey: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/BeforeCursorQuery"
        - name: limit
          in: query
          required: false
          description: >-
            **Default corrected** — `listMessagesQuerySchema`
            (`chat.validator.ts:39-42`) defaults to 30, not the generic 20
            an earlier revision of this document applied here. The 100
            ceiling was already correct.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/MessagePageWire"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /chat/sessions/{sessionId}/close:
    post:
      operationId: closeSession
      tags: [Sessions]
      summary: Close a session.
      description: |
        **Path corrected**: `POST /chat/sessions/{sessionId}/close`
        (`chat.routes.ts:282`).

        Transitions `status` to `CLOSED`. Backs the core method
        `client.closeSession(): Promise<void>` (PRD §6.2) — there is no
        WebSocket frame type for this action, so it is REST-only.

        Naturally idempotent: calling this on a session that is already
        `CLOSED` returns `200` with its current state, not an error.

        **The request body is accepted but entirely ignored.** The handler
        never validates or reads it (`chat.routes.ts:282-293` calls no
        `validate()` on `request.body` at all), and
        `chatSessionService.closeSession(sessionId)` takes only the session
        id — no `reason` parameter exists anywhere in its signature
        (`chat-session.service.ts:227`). `CloseSessionRequest.reason` below
        is kept in this schema only because sending it is harmless (it is
        silently dropped), not because the backend does anything with it.

        **Response shape corrected**: the actual `200` body is
        `SessionCloseResult` (`{sessionId, status, closedAt}`, raw integer
        `status`) — **not** the full `ChatSession` this operation
        previously promised (`chat.routes.ts:289-292`).

        **`@dhaam-ccrm/rest` performs a follow-up fetch.** `packages/core`'s
        `SessionActions.closeSession` contract requires the full
        `ChatSession` shape (`packages/core/src/client/types.ts:105-108` —
        "unlike the WebSocket `SessionSnapshot`... carries full `Profile`
        objects"), which this response cannot satisfy on its own: it has no
        `createdAt`, `assignedAgent`, `customer`, or `ticket`, and uses
        `sessionId` where `ChatSession` needs `id`.
        `@dhaam-ccrm/rest`'s `createSessionActions` adapter calls this
        endpoint and then immediately issues a follow-up
        `GET /chat/sessions/{sessionId}/full` to assemble the full
        `ChatSession` core requires — two HTTP round trips per
        `closeSession()` call. This is now implemented (see
        `packages/rest/src/envelope.ts` and the session-actions adapter),
        not a workaround pending a backend change.
      security:
        - accessToken: []
          publishableKey: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseSessionRequest"
      responses:
        "200":
          description: Session closed (or already was — see Idempotency above).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/SessionCloseResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /chat/sessions/{sessionId}/reopen:
    post:
      operationId: reopenSession
      tags: [Sessions]
      summary: Reopen a closed session, bypassing the bot straight to WAITING_FOR_AGENT.
      description: |
        **Path corrected**: `POST /chat/sessions/{sessionId}/reopen`
        (`chat.routes.ts:296`).

        Backs `client.reopenSession(sessionId): Promise<ChatSession>` (PRD
        §6.2). Deliberately **bypasses** the AI bot and jumps directly to
        `status: WAITING_FOR_AGENT`, `mode: HUMAN`. There is no WebSocket
        frame type for this action, so it is REST-only.

        **No status guard exists.** An earlier revision of this document
        claimed reopening a session that is not `CLOSED` returns
        `400 VALIDATION_FAILED`. **That is not implemented.**
        `reopenSession` (`chat-session.service.ts:358-380`) applies no
        status check at all — it unconditionally applies the
        `WAITING_FOR_AGENT`/`HUMAN` transition to whatever status the
        target session is currently in.

        **Convergence behavior (real, and worth documenting precisely):** if
        the caller's (tenantId, customerId) already has a *different* active
        session, this endpoint does not reopen the requested one at all — it
        returns that other, already-active session's `{id, status, mode}`
        unchanged (`chat-session.service.ts:364-371`). This is the actual
        mechanism behind "reopening a stale session is safe," not a
        request-level idempotency key.

        **`Idempotency-Key` is not implemented** — see "Idempotency" above;
        removed from this operation's parameters.

        **Response shape corrected**: the actual `200` body is
        `SessionMutationResult` (`{sessionId, status, mode}`, raw integer
        codes) — **not** the full `ChatSession` this operation previously
        promised (`chat.routes.ts:310-313`).

        **`@dhaam-ccrm/rest` performs a follow-up fetch**, for the same
        reason and in the same way documented on
        `POST /chat/sessions/{sessionId}/close` above: `SessionActions
        .reopenSession` needs the full `ChatSession`, so the adapter calls
        this endpoint and then `GET /chat/sessions/{sessionId}/full` — using
        whichever `id` this response actually returns, which per the
        convergence behavior above may not be the `sessionId` the caller
        requested. This is now implemented, not a proposal.
      security:
        - accessToken: []
          publishableKey: []
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: Session reopened (or the caller's other already-active session, returned unchanged — see Convergence above).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/SessionMutationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /upload:
    post:
      operationId: uploadAttachment
      tags: [Attachments]
      summary: Upload a file (step 1 of the upload-then-announce flow).
      description: |
        **This operation replaces `POST /sessions/{sessionId}/attachments`**,
        which this document previously modeled and which does not exist on
        the real backend. The actual route is `POST /upload`
        (`upload.routes.ts:82`), mounted directly at the service prefix with
        **no session id in the path at all**.

        Step 1 of the two-step flow: this endpoint uploads and stores the
        file and returns its metadata only. It does **not** create a chat
        message. The caller (core's `client.sendAttachment()`) must follow
        up by sending a WS `message.send` frame whose attachment data
        carries this response's `data`.

        **Session identification, and why it's a query parameter, not a
        path segment or a relied-upon form field.** `chatSessionId` is
        accepted from either the multipart field `chatSessionId` or the
        `?chatSessionId=` query parameter (`upload.routes.ts:144-147`,
        field checked first). Only the query form is safe to rely on: the
        handler reads it via Fastify-multipart's `request.file()` streaming
        API (`upload.routes.ts:124`), which per the plugin's own contract
        only resolves form fields that appear **before** the file part in
        the multipart body (`upload.routes.ts:33-38`). A client whose form
        writer places `file` before `chatSessionId` silently loses the
        field. The query parameter has no such ordering hazard, which is
        why `@dhaam-ccrm/rest`'s `createAttachmentUploader` sends it as a
        query parameter.

        **Tenant is a hint, never authority.** `X-Tenant-ID` header first,
        then `?tenantId=` query, used only to help verify the presented
        access token (`upload.routes.ts:94-98`). The tenant actually
        written to storage is always `verified.tenantId` off the token
        itself (`upload.routes.ts:142,158-163`) — neither header nor query
        can steer an upload into a different tenant's storage prefix.

        **Auth is `accessToken` only** — see the top-level Auth model
        section's documented exception; this route does not check
        `X-Publishable-Key`.

        **Limits, confirmed from source.** Max file size 50 MB
        (`VALIDATION.MAX_FILE_SIZE_MB = 50`,
        `shared/constants/index.ts:129`, enforced by the multipart plugin
        registration at `server.ts:181-186`); the plugin additionally caps
        at 5 files per request (`server.ts:184`), though this endpoint only
        ever reads the first file via `request.file()` — the 5-file
        ceiling is a plugin-wide setting this single-file endpoint does not
        exercise. Allowed MIME types, confirmed from
        `infrastructure/storage/s3-client.ts:13-32` (codec parameters such
        as `;codecs=opus` are stripped before matching, lines 39, 107):

        - **images**: `image/jpeg`, `image/png`, `image/gif`, `image/webp`, `image/svg+xml`
        - **videos**: `video/mp4`, `video/webm`, `video/quicktime`, `video/x-msvideo`
        - **audio**: `audio/mpeg`, `audio/wav`, `audio/ogg`, `audio/webm`, `audio/mp4`
        - **documents**: `application/pdf`, `application/msword`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document`, `application/vnd.ms-excel`, `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, `text/plain`, `text/csv`

        **`mediaType` in the response is lowercase-plural** — `images` /
        `videos` / `audio` / `documents` (`s3-client.ts:38-44`'s
        `getMediaFolder`, echoed straight through as `result.mediaFolder`
        at `upload.routes.ts:172`). This is **not** the upper-snake-case
        `MediaType` enum (`IMAGE`/`VIDEO`/`AUDIO`/`DOCUMENT`) that
        `Attachment.mediaType` documents and that `@dhaam-ccrm/core`'s
        `messageTypeFor` switches on
        (`packages/core/src/messages/controller.ts:87-97`). See
        `UploadResponse.mediaType` below for the exact wire values and the
        adapter mapping — implemented in `packages/rest/src/media-type.ts`.

        **This endpoint models the proxied-upload flow v1 actually uses
        today (multipart straight to chat-service).** PRD §18 Open Question
        7 — whether v2 keeps this proxied shape or moves to direct-to-S3
        presigned URLs minted via REST — is explicitly **unresolved** and
        owned by the backend team. A presigned-URL design would replace
        this single multipart `POST` with a pair of calls (e.g. `POST
        /upload/upload-url` returning a presigned PUT target, then a
        client-side `PUT` straight to storage) and would change this
        response shape to include upload-target fields instead of a final
        `url`. **Do not implement against a presigned flow from this spec —
        it is not modeled here, only flagged.**

        `Idempotency-Key` is not implemented — see "Idempotency" above.
      security:
        - accessToken: []
      parameters:
        - name: X-Tenant-ID
          in: header
          required: false
          description: >-
            Tenant verification hint, checked before the `tenantId` query
            parameter. Never authoritative — see description above.
          schema:
            type: string
        - name: tenantId
          in: query
          required: false
          description: >-
            Tenant verification hint, used only if `X-Tenant-ID` is absent.
            Never authoritative — see description above.
          schema:
            type: string
        - name: chatSessionId
          in: query
          required: false
          description: >-
            The session this attachment belongs to. Optional at the HTTP
            layer (the route does not verify the session exists or that the
            caller owns it) — the caller is expected to supply it so the
            value can be echoed back into the follow-up `message.send`
            frame. See "Session identification" above for why this must be
            a query parameter, not a multipart field.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentEncoding: binary
                  description: The file to upload. See the allow-list above.
              additionalProperties: false
      responses:
        "200":
          description: >-
            Attachment stored. **Status corrected to 200** — the handler
            replies `reply.status(200).send(...)` (`upload.routes.ts:165`),
            not `201` as an earlier revision of this document claimed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/UploadResponse"
        "401":
          description: Missing/invalid `Authorization` header, token verification failed, or the token carries no tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadError"
              examples:
                default:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: "Missing or invalid Authorization header"
        "400":
          description: >-
            No file was present in the multipart body, or the S3 client
            rejected the file (disallowed MIME type or oversized) —
            confirmed as a single 400 status covering both cases, not the
            413/415 split an earlier revision of this document claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadError"
              examples:
                noFile:
                  summary: NO_FILE
                  value:
                    success: false
                    error:
                      code: NO_FILE
                      message: "No file provided in request"
                validationError:
                  summary: VALIDATION_ERROR
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'File type "application/zip" is not allowed. Supported: images, videos, audio, documents.'
        "500":
          description: The S3 upload itself failed for any other reason (bucket misconfigured, AWS error, etc).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadError"
              examples:
                default:
                  value:
                    success: false
                    error:
                      code: UPLOAD_ERROR
                      message: "File upload failed"

  /contacts/commerce-events:
    post:
      operationId: recordCommerceEvent
      tags: [Contacts]
      summary: Record a merchant order or cart event for one of their customers (machine, server-to-server).
      description: |
        Called by the **merchant's own commerce backend** with their
        tenant secret key — the same credential and calling pattern
        `POST /tokens` already uses, never a browser. The target contact
        is resolved-or-created from the body's `customerId`; the tenant
        itself comes from the verified key, never from the body — there
        is no `tenantId` field anywhere in this request.

        Six event types, discriminated on `type` — see `CommerceEvent`.
        The server derives every `Contact` aggregate (`totalOrders`,
        `completedOrders`, `totalSpend`, `averageOrderValue`,
        `itemsInCart`/`cartValue`, `lastOrderMerchant`/`lastOrderCategory`/
        `lastOrderAt`) from the event stream; this call never sends a
        computed total.

        **`200`, never `201`**, for both a first acceptance and a replay
        of an already-applied event — this is a command over an event
        stream, not creation of a REST resource, and using one status
        code for both `applied` states avoids a status-code-encodes-
        idempotency-state trap. See "Idempotency, and rejection recovery"
        in this document's top-level description for the full contract,
        including what happens when the SAME `eventId` is retried after a
        `404`/`422` rejection (short answer: it is processed fresh, not
        short-circuited — the transaction that rejected it rolled back
        the idempotency row along with everything else).

        Request bodies up to 1 MiB are accepted — see "Request size" in
        the top-level description for why this is larger than
        `POST /tokens`'s limit.

        Not reachable via `@dhaam-ccrm/node`'s `UserScopedClient` — only
        `ChatServerClient.recordCommerceEvent()`, alongside `mintToken`,
        holds the secret key this route requires.
      security:
        - secretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceEvent"
            examples:
              orderCompleted:
                summary: order.completed
                value:
                  eventId: "evt_order_9f2a1e"
                  type: order.completed
                  occurredAt: "2026-08-21T10:15:00Z"
                  customerId: "cust_8f2a1e"
                  orderId: "ord_5591"
                  value: 84.5
                  merchant: "Acme Outfitters"
                  category: "apparel"
              cartUpdated:
                summary: cart.updated (full replace of the cart's contents; items may be empty)
                value:
                  eventId: "evt_cart_1a2b3c"
                  type: cart.updated
                  occurredAt: "2026-08-21T10:12:00Z"
                  customerId: "cust_8f2a1e"
                  cartId: "cart_77"
                  items:
                    - name: "Trail runner, size 10"
                      quantity: 1
                      unitPrice: 129.0
      responses:
        "200":
          description: Event accepted (first application) or replayed (already-applied `eventId`) — see `applied`.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/CommerceEventResult"
        "400":
          $ref: "#/components/responses/ContactsBadRequest"
        "401":
          $ref: "#/components/responses/ContactsUnauthorized"
        "404":
          $ref: "#/components/responses/ContactsCartNotFound"
        "422":
          $ref: "#/components/responses/ContactsUnprocessableEntity"
        "429":
          $ref: "#/components/responses/ContactsTooManyRequests"
        "500":
          $ref: "#/components/responses/ContactsInternalError"

  /contacts/{id}/commerce-events:
    post:
      operationId: recordCommerceEventForContact
      tags: [Contacts]
      summary: Record an order or cart correction for one contact (admin/CRM).
      description: |
        The human counterpart to `recordCommerceEvent` — a tenant admin in
        the CRM correcting or backfilling what the machine feed missed or
        got wrong (a phone order, a manual backfill), through the
        identical event-shaped mechanism. Not a raw field-override: every
        write, machine or human, is an event the server derives aggregates
        from — there is no endpoint that sets e.g. `totalSpend` to an
        exact number directly.

        `:id` must already exist for the caller's own tenant — unlike the
        machine path, this path never creates a contact. A typo'd or
        cross-tenant `:id` is `404 CONTACT_NOT_FOUND`, never `403` — see
        `ContactsContactNotFound`.

        Same event taxonomy as `CommerceEvent`, minus `customerId` — see
        `CommerceEventAdmin`. Same `200`-always response shape, and the
        identical idempotency/rejection-recovery contract, as the machine
        path (see "Idempotency, and rejection recovery" above).

        Every event this path writes records the acting admin's identity
        for audit — "who corrected this contact's order history" is a
        support/compliance question a tenant will ask.

        Not exposed via `@dhaam-ccrm/node` — this is a CRM-console
        operation, not part of the merchant-facing SDK surface;
        `ChatServerClient` gains only the machine-path method.
      security:
        - staffToken: []
      parameters:
        - $ref: "#/components/parameters/ContactIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceEventAdmin"
      responses:
        "200":
          description: Event accepted (first application) or replayed (already-applied `eventId`) — see `applied`.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/CommerceEventResult"
        "400":
          $ref: "#/components/responses/ContactsBadRequest"
        "401":
          $ref: "#/components/responses/ContactsUnauthorized"
        "403":
          $ref: "#/components/responses/ContactsForbidden"
        "404":
          description: Either the target contact or the targeted cart does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsError"
              examples:
                contactNotFound:
                  summary: CONTACT_NOT_FOUND
                  value:
                    success: false
                    error:
                      code: CONTACT_NOT_FOUND
                      message: "Contact not found"
                cartNotFound:
                  summary: CART_NOT_FOUND — does not consume the event's eventId, see "Idempotency, and rejection recovery" above
                  value:
                    success: false
                    error:
                      code: CART_NOT_FOUND
                      message: "No cart found for the given cartId"
        "422":
          $ref: "#/components/responses/ContactsUnprocessableEntity"
        "500":
          $ref: "#/components/responses/ContactsInternalError"

  /contacts/carts:
    get:
      operationId: listContactCarts
      tags: [Contacts]
      summary: List/segment carts across the tenant's contacts (admin, win-back campaigns).
      description: |
        The read side of the cart-segmentation use case — e.g. "carts
        abandoned in the last 7 days worth $100+," to build a win-back
        audience. Every query, **including the total count**, carries the
        caller's own `tenantId` — the same rule `contact-list.service.ts`
        states for `GET /contacts`: a count that omitted it would leak the
        size of another tenant's cart segment through a number.

        `status` defaults to `abandoned` — segmentation, not a live-cart
        dashboard, is this operation's reason to exist.
      security:
        - staffToken: []
      parameters:
        - name: status
          in: query
          required: false
          description: >-
            Lowercase only — `LIVE` or `1` are `400`, not silently
            accepted. This is the query-parameter form; the equivalent
            response field (`ContactCartRow.status`) is the integer
            `ContactCartStatus` code, not this string — see that schema's
            description for why the two intentionally differ.
          schema:
            type: string
            enum: [live, abandoned, converted]
            default: abandoned
        - name: minValue
          in: query
          required: false
          description: Inclusive lower bound on `cartValue`.
          schema:
            type: number
            minimum: 0
        - name: maxValue
          in: query
          required: false
          description: Inclusive upper bound on `cartValue`.
          schema:
            type: number
            minimum: 0
        - name: updatedAfter
          in: query
          required: false
          description: ISO-8601. Filters on the cart row's `updatedAt`.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: ISO-8601. Filters on the cart row's `updatedAt`.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Reject, not clamp — a request above the max is `400`, never
            silently truncated. Same bound as `GET /contacts`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sort
          in: query
          required: false
          description: '`<column>:<asc|desc>`. Only these two columns are sortable here.'
          schema:
            type: string
            enum: ["updatedAt:asc", "updatedAt:desc", "cartValue:asc", "cartValue:desc"]
            default: updatedAt:desc
      responses:
        "200":
          description: A tenant-scoped, filtered, paginated page of cart rows.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, total, page, pageSize]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactCartRow"
                  total:
                    type: integer
                    minimum: 0
                    description: Tenant-scoped count matching the same filters as `data` — never a cross-tenant total.
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/ContactsBadRequest"
        "401":
          $ref: "#/components/responses/ContactsUnauthorized"
        "403":
          $ref: "#/components/responses/ContactsForbidden"
        "500":
          $ref: "#/components/responses/ContactsInternalError"

  /contacts/{id}/carts:
    get:
      operationId: listCartsForContact
      tags: [Contacts]
      summary: One contact's full cart history (admin, support-ticket lookup).
      description: |
        A support agent looking at one contact's cart history while
        handling a ticket — every `LIVE`/`ABANDONED`/`CONVERTED` row for
        that contact, including carts that are NOT the one currently
        mirrored onto `Contact.itemsInCart`/`cartValue` (that mirror
        always reflects only the single most-recently-touched `LIVE`
        cart — see `ContactCartRow`'s description for the full multi-cart
        mirror rule). Unpaginated; lightly capped rather than truly
        unbounded, since a contact plausibly has dozens of historical
        carts, not thousands.

        Same 404-not-403 rule as `GET /contacts/:id`.
      security:
        - staffToken: []
      parameters:
        - $ref: "#/components/parameters/ContactIdPath"
      responses:
        "200":
          description: Every cart row for this contact, most recently updated first.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactCartRow"
        "401":
          $ref: "#/components/responses/ContactsUnauthorized"
        "403":
          $ref: "#/components/responses/ContactsForbidden"
        "404":
          $ref: "#/components/responses/ContactsContactNotFound"
        "500":
          $ref: "#/components/responses/ContactsInternalError"

webhooks:
  messageCreated:
    post:
      operationId: webhookMessageCreated
      tags: [Messages]
      summary: A message was created in a session (mirrors WS frame message.new).
      description: |
        Pushed to the customer's backend for every message persisted in any
        of their tenant's sessions, regardless of sender. See "Webhook
        delivery contract" below for the shared envelope, signing, and
        retry semantics.
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookEventTypeHeader"
        - $ref: "#/components/parameters/WebhookAttemptHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessageCreatedEvent"
      responses:
        "200":
          description: Any `2xx` response acknowledges the delivery. Non-`2xx` (or timeout) triggers a retry per the delivery contract.

  sessionUpdated:
    post:
      operationId: webhookSessionUpdated
      tags: [Sessions]
      summary: A session's status, mode, or assignment changed (mirrors WS frame session.updated).
      description: |
        Pushed whenever `status`, `mode`, or `assignedAgent` changes for any
        reason (bot escalation, agent assignment, manual status change).
        For a transition specifically into `CLOSED`, see `sessionClosed`
        below instead, which carries the structured `closeReason` this
        event does not.
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookEventTypeHeader"
        - $ref: "#/components/parameters/WebhookAttemptHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSessionUpdatedEvent"
      responses:
        "200":
          description: Any `2xx` response acknowledges the delivery. Non-`2xx` (or timeout) triggers a retry per the delivery contract.

  sessionClosed:
    post:
      operationId: webhookSessionClosed
      tags: [Sessions]
      summary: A session transitioned to CLOSED (mirrors WS frame session.closed).
      description: |
        Carries the structured `closeReason` PRD §12.5 calls for
        (`MANUAL` vs `SWITCHED` — v1 overloads `CLOSED` to mean both
        "genuinely ended" and "parked because the customer moved to another
        session," and this event's `closeReason` is what disambiguates the
        two for a downstream CRM sync).
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookEventTypeHeader"
        - $ref: "#/components/parameters/WebhookAttemptHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSessionClosedEvent"
      responses:
        "200":
          description: Any `2xx` response acknowledges the delivery. Non-`2xx` (or timeout) triggers a retry per the delivery contract.

  ticketLinked:
    post:
      operationId: webhookTicketLinked
      tags: [Sessions]
      summary: A CRM ticket was linked to a session (mirrors WS frame ticket.linked).
      description: >-
        Mirrors v1's `chat.ticket.linked` WS event (PRD §7.3). The primary
        reason a `@dhaam-ccrm/node`-consuming backend would subscribe to
        webhooks at all — syncing ticket linkage into the customer's own
        CRM/ticketing system without needing a live socket connection.
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookEventTypeHeader"
        - $ref: "#/components/parameters/WebhookAttemptHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookTicketLinkedEvent"
      responses:
        "200":
          description: Any `2xx` response acknowledges the delivery. Non-`2xx` (or timeout) triggers a retry per the delivery contract.

components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      bearerFormat: "dhk_live_... / dhk_test_..."
      description: >-
        Tenant secret key. Valid as the `Authorization: Bearer` credential
        on exactly two routes — `POST /tokens` and, as of this revision,
        `POST /contacts/commerce-events` — and, separately, as the
        HMAC-SHA256 signing key for webhook signature verification. Never
        valid on any endpoint a browser calls, and must never leave the
        customer's own backend (PRD §10.1, §14).


        **What the `POST /contacts/commerce-events` grant does NOT unlock.**
        A secret key is not a general server-to-server admin credential —
        it is scoped narrowly to that one additional route, and even there,
        narrowly within it:

        - It does not authorize any of the five Contacts CRM routes
          (`src/api/rest/routes/contact.routes.ts`) — `GET /contacts`,
          `GET /contacts/:id`, `POST /contacts`, `GET /contacts/cities`,
          `GET /contacts/tags`. Those accept only a staff Cognito token
          (`staffToken` below); a secret key presented there is rejected
          exactly as any other malformed `Authorization` header is today —
          no special-casing was added to recognize it there.
        - On the one route it IS valid for, the request body
          (`CommerceEvent` schema) is `.strict()` and carries **only**
          commerce-event fields — `eventId`, `type`, `occurredAt`,
          `customerId`, and the per-`type` order/cart fields below. It has
          no `name`, `email`, `phone`, `tags`, `consent`, `status`,
          `userType`, `city`, `country`, or any other PII/profile field. A
          merchant holding a secret key can, via `customerId`, find-or-create
          a minimal contact stub (the identical shape
          `contact-identity.service.ts` already produces for a first chat
          contact — `externalId`-only, no email, no profile) and record
          commerce events against it. It cannot read any contact, cannot
          write or overwrite PII on one, cannot change `status`, and cannot
          reach any of the five CRM routes above under any circumstance.
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived, scoped user JWT minted by `POST /tokens` and supplied
        to `@dhaam-ccrm/core` via `getToken()` (PRD §6.1, §10.4). Required,
        together with `publishableKey`, on every session/message/attachment
        endpoint. **Not the same credential as `staffToken` below** — this
        one identifies an end customer, never a tenant's own staff.
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A tenant STAFF member's Cognito-issued access token, verified by
        `authenticateAgent` (`src/api/rest/middleware/auth.middleware.ts`,
        `verifyCognitoToken`). **A different credential from `accessToken`
        above, not a naming variant of it**: `accessToken` is the
        short-lived customer JWT minted by `POST /tokens`; this one
        identifies an agent or admin signed into the CRM/agent console
        through the tenant's own staff login flow — out of scope of this
        document, since no operation here mints it. The Contacts
        commerce-events/cart-read routes below additionally require the
        verified identity to carry the admin role (`requireAdmin`); a
        verified-but-non-admin staff token is rejected with `403`, not
        `401` — see `ContactsForbidden`.
    publishableKey:
      type: apiKey
      in: header
      name: X-Publishable-Key
      description: >-
        Tenant-identifying key (`dhp_live_...` / `dhp_test_...`), safe to ship
        in a client bundle. Identifies a tenant and grants nothing on its
        own (PRD §10.1) — always required together with `accessToken`, never
        as a sole credential. The server rejects a request whose
        `X-Publishable-Key` tenant does not match the `accessToken`'s tenant
        claim with `401 AUTH_INVALID` (PRD §10.2).

  parameters:
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: Opaque session identifier. Do not parse or rely on its internal structure.
      schema:
        type: string
        minLength: 1
    ContactIdPath:
      name: id
      in: path
      required: true
      description: >-
        Opaque contact identifier (`Contact.id`). Do not parse or rely on
        its internal structure. A contact in another tenant, or that never
        existed, is `404`, never `403` — see each operation's description.
      schema:
        type: string
        minLength: 1
    BeforeCursorQuery:
      name: before
      in: query
      required: false
      description: >-
        Opaque message id cursor. Returns the page of messages immediately
        preceding this message. Omit to fetch the most recent page.
      schema:
        type: string
        minLength: 1
    WebhookSignatureHeader:
      name: X-ChatSDK-Signature
      in: header
      required: true
      description: |
        `t=<unix-seconds>,v1=<hex-encoded HMAC-SHA256>`. The signed payload
        is `${t}.${rawRequestBody}`, HMAC-SHA256'd with the tenant's secret
        key (`dhk_live_...` / `dhk_test_...`) as the key. Verify by
        recomputing the HMAC over the *raw, unparsed* body and comparing
        with constant-time comparison; reject if `t` is more than 5 minutes
        from the receiver's clock (replay protection).
        `@dhaam-ccrm/node` (T16) implements this verification so consumers
        never hand-roll it.
      schema:
        type: string
    WebhookIdHeader:
      name: X-ChatSDK-Webhook-Id
      in: header
      required: true
      description: >-
        Unique id for this delivery attempt's underlying event (same value
        as the body's `id`). Use for de-duplication — retries of the same
        event reuse this id.
      schema:
        type: string
    WebhookEventTypeHeader:
      name: X-ChatSDK-Event-Type
      in: header
      required: true
      description: Same value as the body's `type`. Lets a receiver route without parsing the body first.
      schema:
        type: string
    WebhookAttemptHeader:
      name: X-ChatSDK-Webhook-Attempt
      in: header
      required: true
      description: 1-indexed delivery attempt number. Retries use exponential backoff; receivers should treat delivery as at-least-once and dedupe on `X-ChatSDK-Webhook-Id`.
      schema:
        type: integer
        minimum: 1

  headers:
    RateLimitLimit:
      description: Request ceiling for the current window, for the credential that authenticated this request.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix epoch seconds when the current window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    RequestId:
      description: Correlation id for this request, echoed in any error body as `error.details.requestId`.
      schema:
        type: string

  responses:
    BadRequest:
      description: Request failed validation, or is invalid given the resource's current state.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: "userId is required."
                  retryable: false
                  details:
                    field: userId
                    requestId: "req_5f9a2c"
    Unauthorized:
      description: Missing, malformed, expired, revoked, or wrong-tenant credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              summary: AUTH_INVALID
              value:
                error:
                  code: AUTH_INVALID
                  message: "The provided credentials could not be verified."
                  retryable: false
            expired:
              summary: AUTH_EXPIRED
              value:
                error:
                  code: AUTH_EXPIRED
                  message: "The access token has expired."
                  retryable: true
    NotFound:
      description: The resource does not exist, or is not visible to the authenticated caller.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error:
                  code: SESSION_NOT_FOUND
                  message: "No session found with the given id."
                  retryable: false
    Conflict:
      description: >-
        The request conflicts with the resource's current state.
        **Currently unreferenced by any operation in this document** — no
        REST operation modeled here returns a 409 today. Kept as
        documentation of a real backend error class in case a future
        operation is wired to it. **Deviation, if it ever is**: the domain
        error this response was modeled after, `SessionClosedError`, is
        constructed with HTTP 400, not 409
        (`shared/utils/error-handler.ts:82-87`) — see "Error taxonomy"
        above.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error:
                  code: SESSION_CLOSED
                  message: "This session is closed."
                  retryable: false
    TooManyRequests:
      description: Rate limit exceeded for this credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error:
                  code: RATE_LIMITED
                  message: "Too many requests."
                  retryable: true
    InternalError:
      description: Unexpected server-side fault, or a downstream dependency is unavailable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            default:
              value:
                error:
                  code: INTERNAL
                  message: "An unexpected error occurred."
                  retryable: true

    # ── Contacts / commerce-events error responses ──────────────────────────
    # A DIFFERENT envelope from the seven above: these four operations reply
    # through the global Fastify error handler's legacy `{success:false,
    # error:{code,message,details?}}` shape, not this document's bare
    # `{error:{...}}` `Error` schema. See "Contacts / commerce-events
    # surface" in the top-level description for why, and note there is
    # deliberately no `X-Request-Id` response header on any of these —
    # unlike the seven above, the global error handler never sets one.
    ContactsBadRequest:
      description: >-
        Request body or query failed schema validation — `.strict()`
        rejected an unrecognised field, a bound was exceeded (reject, not
        clamp — e.g. `items` over 500 entries is refused outright, never
        truncated to 500), or a required field was missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            default:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: "eventId is required."

    ContactsUnauthorized:
      description: >-
        Missing, malformed, revoked, or wrong-type credential. On the
        secret-key route this is deliberately ONE generic message for every
        failure reason (bad key, revoked key, a publishable key presented
        instead, a malformed header) — there is no oracle, matching
        `POST /tokens`'s own hardening. On the staff-token routes this is a
        Cognito verification failure (missing, expired, or invalid token) —
        distinct from `ContactsForbidden` below, which is a
        verified-but-insufficient-role rejection, not a credential failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            secretKey:
              summary: Secret-key route — bad, revoked, or wrong-type key
              value:
                success: false
                error:
                  code: AUTH_INVALID
                  message: "Invalid or revoked secret key"
            staffToken:
              summary: Staff-token route — token missing or failed verification
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: "Invalid token"

    ContactsForbidden:
      description: >-
        Staff-token routes only. The token verified, but the identity is
        not an admin (`requireAdmin`,
        `src/api/rest/middleware/require-role.ts`). **Backend quirk,
        documented as it actually behaves rather than as it "should"**: the
        error `code` is still `UNAUTHORIZED` here — the same code
        `ContactsUnauthorized`'s staff-token case uses for a `401` — even
        though the HTTP status is `403`. A client distinguishing "not
        signed in" from "signed in, wrong role" must branch on the HTTP
        status, not on `error.code`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            default:
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: "Administrator role required"

    ContactsContactNotFound:
      description: >-
        `:id` does not exist, or exists in another tenant. Always `404`,
        never `403` — a contact id is enumerable, so "does not exist" and
        "not yours" must be indistinguishable (the same rule
        `GET /contacts/:id` documents elsewhere in this service).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            default:
              value:
                success: false
                error:
                  code: CONTACT_NOT_FOUND
                  message: "Contact not found"

    ContactsCartNotFound:
      description: >-
        The `cartId` an event targets (`cart.abandoned`, `cart.converted`)
        has no matching row for this contact. **Does not consume the
        event's `eventId`** — see "Idempotency, and rejection recovery" in
        the top-level description. The whole transaction, including the
        idempotency insert, rolls back on this rejection; retrying the SAME
        `eventId` later (e.g. once the cart actually exists, if a
        `cart.updated` for it is still in flight) is processed normally,
        not replayed as a no-op.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            default:
              value:
                success: false
                error:
                  code: CART_NOT_FOUND
                  message: "No cart found for the given cartId"

    ContactsUnprocessableEntity:
      description: >-
        The event is well-formed but illegal against the target cart's
        current state — most commonly an event (`cart.abandoned`,
        `cart.converted`, or an `order.placed` carrying a `cartId`)
        directed at a cart already `CONVERTED`, which is a terminal state.
        One generic code covers every illegal transition; there is
        deliberately no more specific code such as a hypothetical
        `CART_ALREADY_CONVERTED` for that particular edge — a single `422`
        was chosen over a family of narrower codes. **Does not consume the
        event's `eventId`**, exactly like `ContactsCartNotFound` above —
        see "Idempotency, and rejection recovery" in the top-level
        description. The transaction rolls back in full, so the same
        `eventId` is free to retry; it is not treated as "already seen."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            default:
              value:
                success: false
                error:
                  code: INVALID_CART_TRANSITION
                  message: "This cart is CONVERTED and cannot accept further cart events"

    ContactsTooManyRequests:
      description: >-
        Secret-key route only — per-key rate limit exceeded. The
        staff-token routes have no dedicated limiter of their own beyond
        whatever blanket protection the rest of the admin surface already
        has.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            default:
              value:
                success: false
                error:
                  code: RATE_LIMITED
                  message: "Too many requests."

    ContactsInternalError:
      description: >-
        Unexpected server-side fault. On the secret-key route this
        includes in-transaction contact resolution failing for a reason
        other than a genuine, recoverable conflict (find-or-create by
        `customerId`). Like every rejection in this route family, the
        whole transaction rolls back — the `eventId` is never consumed, so
        retrying it after the underlying fault is fixed is a normal
        request, not a replay.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactsError"
          examples:
            default:
              value:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: "An unexpected error occurred."

  schemas:
    ChatStatus:
      type: string
      description: >-
        The full six-value status set (PRD §12.1, D4) — v1's own type system
        modeled only four of these (`OPEN`/`WAITING_FOR_AGENT`/`ASSIGNED`/
        `CLOSED`), silently collapsing `RESOLVED`/`ON_HOLD` traffic to `OPEN`.
      enum: [OPEN, WAITING_FOR_AGENT, ASSIGNED, CLOSED, RESOLVED, ON_HOLD]
    ChatMode:
      type: string
      enum: [BOT, HUMAN]
    SenderType:
      type: string
      enum: [CUSTOMER, AGENT, BOT, SYSTEM]
    ParticipantType:
      type: string
      description: Who a session participant is. Distinct from SenderType — a participant has no SYSTEM value.
      enum: [CUSTOMER, AGENT, BOT]
    MessageType:
      type: string
      enum: [TEXT, SYSTEM, FILE, IMAGE, VIDEO, AUDIO]
    MediaType:
      type: string
      description: >-
        Attachment category, upper-snake-case, for consistency with every
        other enum in this document (D4). **Confirmed, not merely
        proposed**: this is the shape `@dhaam-ccrm/core`'s `messageTypeFor`
        (`packages/core/src/messages/controller.ts:87-97`) requires, and it
        is never what the wire actually sends — `POST /upload` always
        returns lowercase-plural values (see `UploadResponse.mediaType`).
        `@dhaam-ccrm/rest`'s `createAttachmentUploader` adapter performs
        this exact mapping (`packages/rest/src/media-type.ts`) before
        handing an `Attachment` to core:

        | Wire value (`UploadResponse.mediaType`) | This enum |
        |---|---|
        | `images` | `IMAGE` |
        | `videos` | `VIDEO` |
        | `audio` | `AUDIO` |
        | `documents` | `DOCUMENT` |
      enum: [IMAGE, VIDEO, AUDIO, DOCUMENT]
    CloseReason:
      type: string
      description: >-
        First-class enum for why a session entered CLOSED (PRD §12.5) — v1
        only had this as a loose `string | null` code comment
        (`'SWITCHED' | 'MANUAL' | null`).
      enum: [MANUAL, SWITCHED]
    ErrorCode:
      type: string
      description: >-
        Identical to the WS protocol's canonical `ErrorCode` (PRD §7.4) —
        one enum shared by both transports, and genuinely what the customer
        surface's auth/rate-limit layer emits (`customer-auth.middleware.ts`,
        `rate-limit.ts`). It is **not** the only vocabulary a customer-facing
        REST error can carry — see "Error taxonomy" → "Two vocabularies in
        practice" in the top-level description for the second, legacy
        vocabulary the business-logic layer actually throws (e.g.
        `VALIDATION_ERROR` instead of `VALIDATION_FAILED`,
        `INTERNAL_ERROR` instead of `INTERNAL`). Not every value here can
        occur on every surface (e.g. `PROTOCOL_VERSION_UNSUPPORTED` is
        WS-only).
      enum:
        - AUTH_INVALID
        - AUTH_EXPIRED
        - PROTOCOL_VERSION_UNSUPPORTED
        - RATE_LIMITED
        - VALIDATION_FAILED
        - SESSION_NOT_FOUND
        - SESSION_CLOSED
        - INTERNAL
    ErrorPayload:
      type: object
      description: >-
        Identical shape to the WS protocol's ErrorPayload (PRD §7.2) when
        emitted by the customer surface's auth/rate-limit layer.
        **`retryable` is optional, not required** — corrected from an
        earlier revision. Errors formatted by the global Fastify error
        handler (`middleware/error-handler.ts:29-38`) and by `POST /upload`'s
        hand-written error bodies never include it; treat its absence as
        "unknown," not "false." See "Error taxonomy" in the top-level
        description.
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable. Not for programmatic branching — branch on `code`.
        retryable:
          type: boolean
        details:
          type: object
          description: Structured, error-specific context (e.g. which field failed validation).
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorPayload"

    Profile:
      type: object
      description: Enriched participant profile, generalized from v1's assignedAgent/customer shapes.
      required: [participantId, displayName, email, avatarUrl]
      properties:
        participantId:
          type: string
          description: >-
            Correlation key. `presence.update` frames and `readWatermarks` are
            both keyed by this, so without it neither can be bound to a person.
        displayName:
          type: string
        email:
          type: [string, "null"]
          format: email
        avatarUrl:
          type: [string, "null"]
          format: uri

    Ticket:
      type: object
      description: A linked CRM/support ticket (see the `ticket.linked` WS frame and webhook).
      required: [id]
      properties:
        id:
          type: string
          description: Opaque ticket identifier.
        url:
          type: [string, "null"]
          format: uri

    Participant:
      type: object
      required: [participantType, lastReadAt]
      properties:
        participantType:
          $ref: "#/components/schemas/ParticipantType"
        userId:
          type: [string, "null"]
          description: Opaque identifier of the participant, null for a BOT participant.
        lastReadAt:
          type: [string, "null"]
          format: date-time
          description: >-
            The read watermark model (PRD §9.5, §12.9). Null if this
            participant has not read any messages yet. When multiple AGENT
            participants exist, a client should take the maximum
            `lastReadAt` across them.

    Attachment:
      type: object
      required: [url, fileName, mimeType, size, mediaType]
      properties:
        url:
          type: string
          format: uri
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          minimum: 0
          description: Size in bytes.
        mediaType:
          $ref: "#/components/schemas/MediaType"

    MessageReplyPreview:
      type: object
      description: Denormalized preview of the message being replied to.
      required: [id, content, senderType]
      properties:
        id:
          type: string
        content:
          type: string
        senderType:
          $ref: "#/components/schemas/SenderType"
        senderId:
          type: [string, "null"]
        senderName:
          type: [string, "null"]
        messageType:
          $ref: "#/components/schemas/MessageType"

    ChatMessage:
      type: object
      description: >-
        The **normalized** message shape `@dhaam-ccrm/core` consumes.
        **`GET /chat/sessions/{sessionId}/messages` and
        `GET /chat/sessions/{sessionId}/full` do NOT return this shape on
        the wire** — see `ChatMessageWire` for what they actually send and
        how `@dhaam-ccrm/rest` converts it to this shape.
      required: [id, chatSessionId, senderType, content, messageType, createdAt]
      properties:
        id:
          type: string
          description: >-
            Opaque message identifier. Under D1, this is the client-generated
            ULID for customer-sent messages — it never changes after
            creation; there is no separate server-assigned id to swap in
            later.
        chatSessionId:
          type: string
        senderType:
          $ref: "#/components/schemas/SenderType"
        senderId:
          type: [string, "null"]
        senderName:
          type: [string, "null"]
        content:
          type: string
        messageType:
          $ref: "#/components/schemas/MessageType"
        createdAt:
          type: string
          format: date-time
          description: >-
            The one canonical timestamp field for this concept (D4) — v1
            aliased this across four different field names
            (`timestamp`/`createdAt`/`created_at`/`sentAt`) depending on
            endpoint and rollout era.
        attachment:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
          description: >-
            The **one** canonical location for attachment data (D4) — v1
            read this from either `message.attachment` or
            `message.metadata.attachment` interchangeably.
        replyToMessageId:
          type: [string, "null"]
        replyToMessage:
          oneOf:
            - $ref: "#/components/schemas/MessageReplyPreview"
            - type: "null"
        metadata:
          type: object
          description: Free-form additional context. Never used for attachment data — see `attachment`.
          additionalProperties: true

    ChatMessageWire:
      type: object
      description: >-
        **Actual wire shape returned by `GET /chat/sessions/{sessionId}/messages`
        and `GET /chat/sessions/{sessionId}/full`** — NOT the normalized
        `ChatMessage` shape above. The REST history handlers
        (`message.service.ts` `getMessages`/`getMessagesPaginated`,
        `getSessionWithMessages`) return the Prisma row for `ChatMessage`
        directly, with none of the wire projection the WebSocket path
        applies (`api/websocket/v2/projection.ts` `projectMessage`). Two
        concrete deviations from `ChatMessage`:

        1. `senderType` and `messageType` are the backend's internal
           **integer** codes, not string enum names. See `senderType`/
           `messageType` below for the exact mapping.
        2. `attachment` data is **not lifted to top level**. When a message
           carries an attachment it is nested at `metadata.attachment`
           (with the same shape as `Attachment` below); `attachment` itself
           is absent from the row entirely.

        `@dhaam-ccrm/rest`'s `createHistorySource` adapter converts every
        row of this shape into `ChatMessage` before handing it to
        `@dhaam-ccrm/core` (int→string enum lookup, and lifting/stripping
        `metadata.attachment` — implemented in
        `packages/rest/src/projection.ts`). This is where the "message
        history not appearing after reload" defect actually lived, and this
        schema exists so that normalization step is never silently
        reverted.
      required: [id, chatSessionId, senderType, content, messageType, createdAt]
      properties:
        id:
          type: string
        chatSessionId:
          type: string
        senderType:
          type: integer
          enum: [1, 2, 3, 4]
          description: "1=CUSTOMER, 2=AGENT, 3=BOT, 4=SYSTEM (`shared/constants/enums.ts:29-34`)."
        senderId:
          type: [string, "null"]
        content:
          type: string
        messageType:
          type: integer
          enum: [1, 2, 3, 4, 5, 6, 7]
          description: "1=TEXT, 2=SYSTEM, 3=FILE, 4=IMAGE, 5=VIDEO, 6=AUDIO, 7=TYPING (`shared/constants/enums.ts:36-44`)."
        metadata:
          type: object
          description: >-
            Free-form context AND, when present, an `attachment` key holding
            the same shape as `Attachment` — this is the legacy column v1
            used for both purposes; nothing on this REST path splits them.
          additionalProperties: true
        replyToMessageId:
          type: [string, "null"]
        replyToMessage:
          oneOf:
            - $ref: "#/components/schemas/MessageReplyPreview"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        seq:
          type: [integer, "null"]
        visibility:
          type: integer
          description: "MessageVisibility as persisted; PUBLIC by default. Not present in the normalized `ChatMessage`."

    ChatSession:
      type: object
      required: [id, status, mode, createdAt, closedAt, assignedAgent, customer, ticket]
      properties:
        id:
          type: string
          description: Opaque session identifier.
        status:
          $ref: "#/components/schemas/ChatStatus"
        mode:
          $ref: "#/components/schemas/ChatMode"
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: [string, "null"]
          format: date-time
        assignedAgent:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
        customer:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
        ticket:
          oneOf:
            - $ref: "#/components/schemas/Ticket"
            - type: "null"

    SessionFullWire:
      type: object
      description: >-
        Actual wire shape of `GET /chat/sessions/{sessionId}/full`'s `200`
        body (inside `data`) — replaces the idealized `SessionFull`, which
        this document previously documented and which is no longer
        referenced by any operation. Only `messages` differs structurally
        from what `SessionFull` modeled — see `ChatMessageWire`. `session`'s
        own `status`/`mode` are also raw integers on this path (reuse
        `ChatSession`'s `status`/`mode` field names but expect the same
        integer codes documented on `ChatMessageWire.senderType`'s sibling
        table, i.e. `ChatStatus`/`ChatMode`'s backend ints), and its
        `assignedAgent`/`customer` are missing `participantId` — a smaller,
        separately-tracked accuracy gap not fully re-modeled in this
        revision.
      required: [session, participants, messages, hasMore]
      properties:
        session:
          $ref: "#/components/schemas/ChatSession"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageWire"
          description: Most recent page, ascending chronological order (oldest first).
        hasMore:
          type: boolean
          description: Whether older messages exist beyond this page. Page further back with `GET /chat/sessions/{sessionId}/messages`.

    ChatSessionSummaryWire:
      type: object
      description: >-
        Wire shape of `GET /chat/sessions/customer`'s `sessions[]` items, as
        built by `chat.routes.ts`'s `listSessions` handler from
        `chat-session.repository.ts`'s `findCustomerHistory` +
        `unreadCountsForCustomer`, plus `chat-user.service.ts`'s
        `getUsersByExternalIds` for `handledBy.displayName`. As of this
        revision this is field-for-field the SDK's `ChatSessionSummary`
        (`packages/core/src/state/types.ts:223-240`) — `status`/`mode` are
        now the canonical v2 STRING enums (D4), and `lastMessageAt` /
        `lastMessagePreview` / `unreadCount` replace the earlier nested
        `lastMessage` object — plus the additive `handledBy` field below.
        Still unconsumed by `@dhaam-ccrm/core` as of this revision — see the
        `listSessions` operation's description.
      required: [id, status, mode, createdAt, closedAt, lastMessageAt, unreadCount]
      properties:
        id:
          type: string
          description: Opaque session identifier.
        status:
          $ref: "#/components/schemas/ChatStatus"
        mode:
          $ref: "#/components/schemas/ChatMode"
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: [string, "null"]
          format: date-time
        lastMessageAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Timestamp of the most recent PUBLIC message (§11.2 — INTERNAL
            agent notes never reach a customer-facing response), or `null`
            if the session has no public message yet.
        lastMessagePreview:
          type: string
          description: >-
            Verbatim content of the most recent PUBLIC message. Absent —
            never an empty string — when the session has no public message
            yet; mirror `lastMessageAt: null` to tell "no preview" apart
            from "preview happens to be empty".
        unreadCount:
          type: integer
          minimum: 0
          description: >-
            PUBLIC messages not sent by the customer, created after the
            customer's own read watermark for this session (or all such
            messages if they have never read it). `0`, never absent, when
            nothing is unread.
        handledBy:
          type: object
          description: >-
            Who is/was handling this session. Absent — never `null` or a
            placeholder — when nobody has picked it up yet (e.g. freshly
            escalated and still unassigned): the bot has already handed
            off and no agent has taken it, so neither `BOT` nor `AGENT`
            would be a true answer. See `buildHandledBy` in `chat.routes.ts`
            for the exact assigned-agent / still-on-bot / nobody-yet rule.
          required: [kind, id, displayName]
          properties:
            kind:
              type: string
              enum: [AGENT, BOT]
            id:
              type: string
              description: >-
                The agent's external id for `kind: AGENT` (falls back to
                that id as `displayName` too, if the `ChatUser` display-name
                cache has no entry). A fixed sentinel (`"bot"`) for
                `kind: BOT` — there is no per-tenant bot identity anywhere
                in the schema today.
            displayName:
              type: string

    SessionSummaryPageWire:
      type: object
      description: >-
        Actual wire shape of `GET /chat/sessions/customer`'s `200` body
        (inside `data`) — replaces the idealized `SessionSummaryPage`.
        **No `hasMore` field at all** — `chat.routes.ts:238` replies
        `{ success: true, data: { sessions } }` and nothing else.
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSessionSummaryWire"

    MessagePageWire:
      type: object
      description: >-
        Actual wire shape of `GET /chat/sessions/{sessionId}/messages`'s
        `200` body (inside `data`) — replaces the idealized `MessagePage`,
        which this document previously documented and which is no longer
        referenced by any operation. See `ChatMessageWire`.
      required: [messages, hasMore]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageWire"
        hasMore:
          type: boolean

    CreateSessionRequest:
      type: object
      description: >-
        Customer identity is derived entirely from the validated
        `accessToken` — this body never repeats it.
      properties:
        metadata:
          type: object
          description: Optional free-form client-side context (e.g. originating page URL, locale).
          additionalProperties: true

    CloseSessionRequest:
      type: object
      description: >-
        Accepted but currently ignored by the backend — see the
        `POST /chat/sessions/{sessionId}/close` operation description for
        why `reason` has no effect today (`chatSessionService.closeSession`
        takes only the session id).
      properties:
        reason:
          $ref: "#/components/schemas/CloseReason"
          default: MANUAL

    UploadResponse:
      type: object
      description: >-
        Actual `data` payload of `POST /upload`'s `200` response
        (`upload.routes.ts:166-175`). Distinct from the idealized
        `Attachment` schema above — most notably `mediaType` is
        lowercase-plural here, not the `IMAGE`/`VIDEO`/`AUDIO`/`DOCUMENT`
        enum `Attachment.mediaType` documents. See `MediaType`'s
        description for the adapter's mapping between the two.
      required: [url, fileName, mimeType, size, mediaType]
      properties:
        url:
          type: string
          format: uri
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          minimum: 0
          description: Size in bytes.
        mediaType:
          type: string
          enum: [images, videos, audio, documents]
          description: >-
            The S3 storage folder the file was categorized into
            (`s3-client.ts:38-44`), echoed back verbatim. Lowercase, plural
            — see this schema's top-level description.
        chatSessionId:
          type: [string, "null"]
          description: Echoes the request's `chatSessionId` query parameter, or absent if none was supplied.

    UploadErrorPayload:
      type: object
      description: >-
        `POST /upload`'s hand-written error shape
        (`upload.routes.ts:88-91,109-111,118-120,127-130,197-203`) — **not**
        the shared `ErrorPayload`. Only four codes are ever emitted, and
        `retryable` is never present.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, NO_FILE, VALIDATION_ERROR, UPLOAD_ERROR]
        message:
          type: string

    UploadError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/UploadErrorPayload"

    SessionMutationResult:
      type: object
      description: >-
        Actual `data` payload of `POST /chat/sessions`'s `201` response and
        `POST /chat/sessions/{sessionId}/reopen`'s `200` response
        (`chat.routes.ts:217-218,312-313`) — both build their reply from
        exactly these three fields and nothing else. `status`/`mode` are
        raw integer codes, and the id field is named `sessionId`, not `id`
        — unlike `ChatSession`.
      required: [sessionId, status, mode]
      properties:
        sessionId:
          type: string
        status:
          type: integer
          description: "1=OPEN, 2=WAITING_FOR_AGENT, 3=ASSIGNED, 4=CLOSED, 5=RESOLVED, 6=ON_HOLD (`shared/constants/enums.ts:15-22`)."
        mode:
          type: integer
          description: "1=BOT, 2=HUMAN (`shared/constants/enums.ts:24-27`)."

    SessionCloseResult:
      type: object
      description: >-
        Actual `data` payload of `POST /chat/sessions/{sessionId}/close`'s
        `200` response (`chat.routes.ts:289-292`).
      required: [sessionId, status, closedAt]
      properties:
        sessionId:
          type: string
        status:
          type: integer
          description: >-
            Raw integer `ChatStatus` code — will be 4 (CLOSED) on a fresh
            close, but reflects whatever the row's current status is on the
            naturally-idempotent repeat-call path.
        closedAt:
          type: [string, "null"]
          format: date-time

    MintTokenRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
          description: >-
            Stable identifier for the end user in the customer's own system.
            Becomes the token's `sub` claim and the resulting session's
            customer identity.
        name:
          type: string
        email:
          type: string
          format: email
      additionalProperties:
        description: >-
          Arbitrary customer-defined claims embedded in the minted JWT (e.g.
          plan tier, account region). Reserved claim names (`sub`, `iat`,
          `exp`, `iss`, `aud`, `tenantId`) are rejected with `400
          VALIDATION_FAILED`.

    MintTokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT. Pass to the SDK via `getToken()` (PRD §6.1).
        expiresIn:
          type: integer
          minimum: 1
          description: Token lifetime in seconds from the moment of minting.

    WebhookMessageCreatedEvent:
      type: object
      required: [id, type, createdAt, tenantId, data]
      properties:
        id:
          type: string
        type:
          type: string
          const: message.created
        createdAt:
          type: string
          format: date-time
        tenantId:
          type: string
        data:
          $ref: "#/components/schemas/ChatMessage"

    WebhookSessionUpdatedEvent:
      type: object
      required: [id, type, createdAt, tenantId, data]
      properties:
        id:
          type: string
        type:
          type: string
          const: session.updated
        createdAt:
          type: string
          format: date-time
        tenantId:
          type: string
        data:
          $ref: "#/components/schemas/ChatSession"

    WebhookSessionClosedEvent:
      type: object
      required: [id, type, createdAt, tenantId, data]
      properties:
        id:
          type: string
        type:
          type: string
          const: session.closed
        createdAt:
          type: string
          format: date-time
        tenantId:
          type: string
        data:
          type: object
          required: [session, closeReason]
          properties:
            session:
              $ref: "#/components/schemas/ChatSession"
            closeReason:
              $ref: "#/components/schemas/CloseReason"

    WebhookTicketLinkedEvent:
      type: object
      required: [id, type, createdAt, tenantId, data]
      properties:
        id:
          type: string
        type:
          type: string
          const: ticket.linked
        createdAt:
          type: string
          format: date-time
        tenantId:
          type: string
        data:
          type: object
          required: [sessionId, ticket]
          properties:
            sessionId:
              type: string
            ticket:
              $ref: "#/components/schemas/Ticket"

    # ═══════════════════════════════════════════════════════════════════════
    # Contacts / commerce-events — see "Contacts / commerce-events surface"
    # in the top-level description for the envelope, error-vocabulary, and
    # idempotency contract these schemas participate in.
    # ═══════════════════════════════════════════════════════════════════════

    ContactsErrorCode:
      type: string
      description: >-
        The legacy `ERROR_CODES` vocabulary (`shared/constants/index.ts`),
        thrown as `AppError` and formatted by the global Fastify error
        handler — see "Contacts / commerce-events surface" above for why
        this, and not `ErrorCode`, is what these four operations actually
        emit, and for `AUTH_INVALID`'s deliberate name-sharing across both
        vocabularies.
      enum:
        - VALIDATION_ERROR
        - AUTH_INVALID
        - UNAUTHORIZED
        - CONTACT_NOT_FOUND
        - CART_NOT_FOUND
        - INVALID_CART_TRANSITION
        - RATE_LIMITED
        - INTERNAL_ERROR

    ContactsErrorPayload:
      type: object
      description: >-
        No `retryable` field — the global error handler never sets one.
        Its absence means "unknown," not "false"; apply your own default
        retry policy for `429`/`500` rather than reading it from the body.
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ContactsErrorCode"
        message:
          type: string
          description: Human-readable. Not for programmatic branching — branch on `code`.
        details:
          type: object
          additionalProperties: true
          description: Structured, error-specific context. Frequently absent.

    ContactsError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ContactsErrorPayload"

    CommerceCartItem:
      type: object
      description: One line item inside a `cart.updated` snapshot.
      required: [name, quantity, unitPrice]
      properties:
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 300
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
        unitPrice:
          type: number
          minimum: 0

    # ── Machine-path (secret-key) event variants — customerId required ──────

    OrderPlacedEvent:
      type: object
      description: >-
        An order was submitted; fulfillment/payment outcome not yet known.
        Increments `totalOrders`. Updates `lastOrderMerchant`/
        `lastOrderCategory`/`lastOrderAt` only if `occurredAt` is strictly
        newer than the contact's stored `lastOrderAt` AND the corresponding
        field was supplied. `value`, if supplied, is recorded for audit
        only — never applied to `totalSpend` (only `order.completed`'s own
        `value` does that). If `cartId` matches a `LIVE` cart, that cart is
        transitioned to `CONVERTED` as a side effect — the identical
        transition an explicit `cart.converted` for the same `cartId` would
        produce. A `cartId` with no matching row is a silent no-op, not a
        `404` — only a `cart.*` event 404s on an unknown `cartId`.
      required: [eventId, type, occurredAt, customerId, orderId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key — see "Idempotency, and rejection recovery" above.
        type:
          type: string
          const: order.placed
          description: >-
            An open, additive tag for "a kind of thing that happened," not
            a closed-cardinality state field — deliberately a wire STRING
            rather than an integer enum, mirroring `@dhaam-ccrm/node`'s own
            webhook `type` field (see `WebhookMessageCreatedEvent.type`
            etc. above) rather than this codebase's usual "enums are
            integers on the wire" rule. That rule governs closed-
            cardinality *state* (e.g. `ContactCartRow.status` below);
            `type` here is the same kind of open catalog
            `message.created`/`session.updated` already are — new event
            types are additive, and nothing downstream switches on it as a
            fixed-size set.
        occurredAt:
          type: string
          format: date-time
          description: >-
            When this actually happened, not when the caller calls this
            endpoint. ISO-8601, UTC. Rejected with `400` if more than 5
            minutes in the future (clock-skew tolerance). No lower bound —
            a backdated admin correction is legitimate.
        customerId:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The caller's own identifier for the shopper — the same value
            passed as `userId` to `POST /tokens`. The server resolves-or-
            creates a `Contact` for `(tenantId, externalId = customerId)`.
            This is the ONLY field that may bind an event to a contact;
            nothing else in this body is ever used for identity matching.
        orderId:
          type: string
          minLength: 1
          maxLength: 200
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 120
        cartId:
          type: string
          minLength: 1
          maxLength: 200
          description: If this order completed a cart checkout, the cart's id — triggers the `cart.converted` side effect described above.
        value:
          type: number
          minimum: 0
          description: Audit-only on this event type. Never applied to `totalSpend` — see the schema description.

    OrderCompletedEvent:
      type: object
      description: >-
        An order finished successfully (paid, fulfilled — the merchant's
        own definition of "done"). Increments `completedOrders`; adds
        `value` to `totalSpend`; recomputes `averageOrderValue =
        totalSpend / completedOrders` in the same transaction (`0` when
        `completedOrders` is `0` — never a division-by-zero error).
        Updates `lastOrderMerchant`/`lastOrderCategory`/`lastOrderAt` under
        the identical latest-wins rule `order.placed` uses — a completed
        order is evidence of "last order" activity too.
      required: [eventId, type, occurredAt, customerId, orderId, value]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key — see "Idempotency, and rejection recovery" above.
        type:
          type: string
          const: order.completed
          description: >-
            Wire STRING, not an integer enum — see `OrderPlacedEvent.type`
            for the full rationale (this is an open event tag, not
            closed-cardinality state).
        occurredAt:
          type: string
          format: date-time
          description: >-
            ISO-8601, UTC. Rejected with `400` if more than 5 minutes in
            the future; no lower bound. See `OrderPlacedEvent.occurredAt`.
        customerId:
          type: string
          minLength: 1
          maxLength: 255
          description: The caller's own identifier for the shopper. See `OrderPlacedEvent.customerId`.
        orderId:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: number
          minimum: 0
          description: Applied to `totalSpend` and folded into `averageOrderValue` — the only event type whose `value` moves an aggregate.
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 120

    OrderCancelledEvent:
      type: object
      description: >-
        An order was cancelled or failed. Increments `cancelledOrders`
        only. Deliberately does **not** touch `lastOrderMerchant`/
        `lastOrderCategory`/`lastOrderAt` — a cancellation is real activity
        but not, in a support agent's reading of "last order," an order
        that actually happened; keeping it out of the latest-wins
        comparison means "last order" always names a placed-or-completed
        order, never a cancelled one that happens to be the most recent
        event.
      required: [eventId, type, occurredAt, customerId, orderId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key — see "Idempotency, and rejection recovery" above.
        type:
          type: string
          const: order.cancelled
          description: >-
            Wire STRING, not an integer enum — see `OrderPlacedEvent.type`
            for the full rationale.
        occurredAt:
          type: string
          format: date-time
          description: ISO-8601, UTC. Rejected with `400` if more than 5 minutes in the future; no lower bound.
        customerId:
          type: string
          minLength: 1
          maxLength: 255
          description: The caller's own identifier for the shopper. See `OrderPlacedEvent.customerId`.
        orderId:
          type: string
          minLength: 1
          maxLength: 200

    CartUpdatedEvent:
      type: object
      description: >-
        The current, LIVE state of one cart — a **full replace** of that
        cart's contents, not a delta. `items` may be empty: an
        emptied-but-still-open cart is a valid `LIVE` state with 0 items,
        distinct from `ABANDONED`. A stale arrival — `occurredAt` older
        than the cart row's current snapshot — is silently ignored:
        `applied: true`, no state change, NOT treated as a caller error
        (distinct from the idempotency `applied: false` case, which is
        about the *event* having been seen before rather than the *state*
        being stale). `Contact.itemsInCart`/`cartValue` are recomputed from
        whichever `LIVE` cart is now this contact's most-recently-touched
        one — which may or may not be the cart this event just touched;
        see `ContactCartRow`'s description for the full mirror rule.
      required: [eventId, type, occurredAt, customerId, cartId, items]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key — see "Idempotency, and rejection recovery" above.
        type:
          type: string
          const: cart.updated
          description: >-
            Wire STRING, not an integer enum — see `OrderPlacedEvent.type`
            for the full rationale.
        occurredAt:
          type: string
          format: date-time
          description: ISO-8601, UTC. Rejected with `400` if more than 5 minutes in the future; no lower bound.
        customerId:
          type: string
          minLength: 1
          maxLength: 255
          description: The caller's own identifier for the shopper. See `OrderPlacedEvent.customerId`.
        cartId:
          type: string
          minLength: 1
          maxLength: 200
          description: The merchant's own cart identifier. Unique per CONTACT, not globally.
        items:
          type: array
          minItems: 0
          maxItems: 500
          items:
            $ref: "#/components/schemas/CommerceCartItem"
          description: >-
            Full replacement of the cart's line items. A 501st entry is
            refused outright with `400` — reject, not clamp — never
            silently truncated to 500.

    CartAbandonedEvent:
      type: object
      description: >-
        A specific cart is no longer being actively shopped — caller-
        declared (this event) or server-detected (an idle-cart sweep) both
        produce the identical state transition. The row must exist
        (`404 CART_NOT_FOUND` otherwise) and be `LIVE`; transitions to
        `ABANDONED`. Already `ABANDONED` is a no-op — `200`, `applied:
        true`, no state change. Already `CONVERTED` is
        `422 INVALID_CART_TRANSITION` — `CONVERTED` is terminal. See
        `ContactsCartNotFound` / `ContactsUnprocessableEntity` for the
        rejection responses and their (non-)effect on this event's
        `eventId`.
      required: [eventId, type, occurredAt, customerId, cartId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key — see "Idempotency, and rejection recovery" above.
        type:
          type: string
          const: cart.abandoned
          description: >-
            Wire STRING, not an integer enum — see `OrderPlacedEvent.type`
            for the full rationale.
        occurredAt:
          type: string
          format: date-time
          description: ISO-8601, UTC. Rejected with `400` if more than 5 minutes in the future; no lower bound.
        customerId:
          type: string
          minLength: 1
          maxLength: 255
          description: The caller's own identifier for the shopper. See `OrderPlacedEvent.customerId`.
        cartId:
          type: string
          minLength: 1
          maxLength: 200

    CartConvertedEvent:
      type: object
      description: >-
        A specific cart resulted in a checkout. Also triggered as a side
        effect of `order.placed` carrying the same `cartId` — they describe
        the same real-world action two ways; use whichever your checkout
        flow naturally emits. The row must exist and be `LIVE` or
        `ABANDONED` (a customer may return to an abandoned cart and check
        out); transitions to `CONVERTED`. Already `CONVERTED` is a no-op —
        `200`, `applied: true`, no state change. `404 CART_NOT_FOUND` if
        the row never existed. `orderId`, if supplied, is stored for
        correlation only — never applied to any aggregate
        (`order.completed`'s own `value` is what moves `totalSpend`).
      required: [eventId, type, occurredAt, customerId, cartId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
          description: Idempotency key — see "Idempotency, and rejection recovery" above.
        type:
          type: string
          const: cart.converted
          description: >-
            Wire STRING, not an integer enum — see `OrderPlacedEvent.type`
            for the full rationale.
        occurredAt:
          type: string
          format: date-time
          description: ISO-8601, UTC. Rejected with `400` if more than 5 minutes in the future; no lower bound.
        customerId:
          type: string
          minLength: 1
          maxLength: 255
          description: The caller's own identifier for the shopper. See `OrderPlacedEvent.customerId`.
        cartId:
          type: string
          minLength: 1
          maxLength: 200
        orderId:
          type: string
          minLength: 1
          maxLength: 200
          description: Correlation only — stored on the cart row, never applied to any aggregate.

    CommerceEvent:
      description: >-
        Discriminated union on `type`, one of the six order/cart events.
        This is the machine-path (secret-key) request shape — `customerId`
        is required on every variant. Mirrors `@dhaam-ccrm/node`'s
        `CommerceEvent` union (`packages/node/src/types.ts`) field-for-field.
      oneOf:
        - $ref: "#/components/schemas/OrderPlacedEvent"
        - $ref: "#/components/schemas/OrderCompletedEvent"
        - $ref: "#/components/schemas/OrderCancelledEvent"
        - $ref: "#/components/schemas/CartUpdatedEvent"
        - $ref: "#/components/schemas/CartAbandonedEvent"
        - $ref: "#/components/schemas/CartConvertedEvent"
      discriminator:
        propertyName: type
        mapping:
          order.placed: "#/components/schemas/OrderPlacedEvent"
          order.completed: "#/components/schemas/OrderCompletedEvent"
          order.cancelled: "#/components/schemas/OrderCancelledEvent"
          cart.updated: "#/components/schemas/CartUpdatedEvent"
          cart.abandoned: "#/components/schemas/CartAbandonedEvent"
          cart.converted: "#/components/schemas/CartConvertedEvent"

    # ── Admin-path (staff-token) event variants — no customerId ─────────────
    # Field-for-field identical to their machine-path counterparts above,
    # minus `customerId` (the target contact is named by `:id` in the path
    # instead) and with `type` narrowed to the same literal. Kept as
    # separate, self-contained schemas — rather than composed via `allOf` —
    # to match this document's existing style (no `allOf` is used anywhere
    # else in it) and to keep `additionalProperties: false` unambiguous
    # without relying on `unevaluatedProperties`.

    OrderPlacedEventAdmin:
      type: object
      description: >-
        Admin-path variant of `OrderPlacedEvent` — see that schema for the
        full behavior. No `customerId`; the target contact is named by
        `:id` in the path, and supplying `customerId` here is a `400`
        (`.strict()` rejects the unrecognised field).
      required: [eventId, type, occurredAt, orderId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          const: order.placed
        occurredAt:
          type: string
          format: date-time
        orderId:
          type: string
          minLength: 1
          maxLength: 200
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 120
        cartId:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: number
          minimum: 0

    OrderCompletedEventAdmin:
      type: object
      description: >-
        Admin-path variant of `OrderCompletedEvent` — see that schema for
        the full behavior. No `customerId`.
      required: [eventId, type, occurredAt, orderId, value]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          const: order.completed
        occurredAt:
          type: string
          format: date-time
        orderId:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: number
          minimum: 0
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 120

    OrderCancelledEventAdmin:
      type: object
      description: >-
        Admin-path variant of `OrderCancelledEvent` — see that schema for
        the full behavior. No `customerId`.
      required: [eventId, type, occurredAt, orderId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          const: order.cancelled
        occurredAt:
          type: string
          format: date-time
        orderId:
          type: string
          minLength: 1
          maxLength: 200

    CartUpdatedEventAdmin:
      type: object
      description: >-
        Admin-path variant of `CartUpdatedEvent` — see that schema for the
        full behavior, including the full-replace and stale-arrival rules.
        No `customerId`.
      required: [eventId, type, occurredAt, cartId, items]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          const: cart.updated
        occurredAt:
          type: string
          format: date-time
        cartId:
          type: string
          minLength: 1
          maxLength: 200
        items:
          type: array
          minItems: 0
          maxItems: 500
          items:
            $ref: "#/components/schemas/CommerceCartItem"

    CartAbandonedEventAdmin:
      type: object
      description: >-
        Admin-path variant of `CartAbandonedEvent` — see that schema for
        the full behavior, including the terminal-`CONVERTED` rejection.
        No `customerId`.
      required: [eventId, type, occurredAt, cartId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          const: cart.abandoned
        occurredAt:
          type: string
          format: date-time
        cartId:
          type: string
          minLength: 1
          maxLength: 200

    CartConvertedEventAdmin:
      type: object
      description: >-
        Admin-path variant of `CartConvertedEvent` — see that schema for
        the full behavior. No `customerId`.
      required: [eventId, type, occurredAt, cartId]
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          const: cart.converted
        occurredAt:
          type: string
          format: date-time
        cartId:
          type: string
          minLength: 1
          maxLength: 200
        orderId:
          type: string
          minLength: 1
          maxLength: 200

    CommerceEventAdmin:
      description: >-
        The admin-path (staff-token) request shape for
        `POST /contacts/{id}/commerce-events` — field-for-field identical
        to `CommerceEvent` except `customerId` is absent from every
        variant. The target contact is named by `:id` in the path instead;
        supplying `customerId` in the body is a `400` (`.strict()` rejects
        the unrecognised field — it does not silently ignore it, so a
        caller cannot believe it retargeted the event and be wrong).
      oneOf:
        - $ref: "#/components/schemas/OrderPlacedEventAdmin"
        - $ref: "#/components/schemas/OrderCompletedEventAdmin"
        - $ref: "#/components/schemas/OrderCancelledEventAdmin"
        - $ref: "#/components/schemas/CartUpdatedEventAdmin"
        - $ref: "#/components/schemas/CartAbandonedEventAdmin"
        - $ref: "#/components/schemas/CartConvertedEventAdmin"
      discriminator:
        propertyName: type
        mapping:
          order.placed: "#/components/schemas/OrderPlacedEventAdmin"
          order.completed: "#/components/schemas/OrderCompletedEventAdmin"
          order.cancelled: "#/components/schemas/OrderCancelledEventAdmin"
          cart.updated: "#/components/schemas/CartUpdatedEventAdmin"
          cart.abandoned: "#/components/schemas/CartAbandonedEventAdmin"
          cart.converted: "#/components/schemas/CartConvertedEventAdmin"

    CommerceEventResult:
      type: object
      description: Response `data` for both write operations, first application or replay alike.
      required: [eventId, type, contactId, applied]
      properties:
        eventId:
          type: string
        type:
          type: string
          enum: [order.placed, order.completed, order.cancelled, cart.updated, cart.abandoned, cart.converted]
        contactId:
          type: string
          description: The resolved (machine path) or path-supplied (admin path) contact's opaque id — same identifier `GET /contacts/:id` returns as `id`.
        applied:
          type: boolean
          description: >-
            `false` only when this `eventId` had already been accepted and
            processed before — a replay. The mutation is not re-applied;
            these fields are read back from the original stored event, not
            recomputed. `true` on first acceptance AND on an accepted
            no-op (e.g. `cart.abandoned` repeated against an already-
            `ABANDONED` cart, or a stale out-of-order `cart.updated`) —
            `applied` distinguishes "have I seen this `eventId` before,"
            not "did this event change any state."

    ContactCartRow:
      type: object
      description: >-
        One row from `contact_carts`, as returned by both cart-read
        operations. `status` is a raw integer code — this feature follows
        the same wire convention every other Contacts CRM enum already
        uses (`GET /contacts`'s `status`/`userType`/`channel` fields), not
        the lowercase string the `status` QUERY parameter on
        `GET /contacts/carts` accepts. The two are intentionally different
        shapes for the same concept: the query parameter is a human-typed
        filter value, the response field is the established typed-enum
        wire contract. `Contact.itemsInCart`/`cartValue` mirror only the
        contact's single most-recently-touched `LIVE` row (by
        `lastEventAt`) — a contact can have more than one `LIVE` row here
        at once (two browser tabs, a guest cart merged into a signed-in
        one), and this operation is the only way to see the rest.
      required: [contactId, contactRef, cartId, status, itemsCount, cartValue, items, abandonedAt, convertedAt, updatedAt]
      properties:
        contactId:
          type: string
          description: Opaque contact id — same value as `GET /contacts/:id`'s `id`.
        contactRef:
          type: string
          description: The contact's customer-facing reference — what an agent building a win-back campaign wants to see, not the opaque id.
        cartId:
          type: string
          description: The merchant's own cart identifier, as supplied on `cart.*` events. Unique per contact, not globally.
        status:
          type: integer
          enum: [1, 2, 3]
          description: "`ContactCartStatus`: 1=LIVE, 2=ABANDONED, 3=CONVERTED (`shared/constants/enums.ts`)."
        itemsCount:
          type: integer
          minimum: 0
          description: Sum of `quantity` across the cart's line items as of the most recently applied `cart.updated`.
        cartValue:
          type: number
          minimum: 0
          description: Sum of `unitPrice × quantity` across the cart's line items.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommerceCartItem"
          description: Line-item snapshot as of the most recently applied `cart.updated`.
        abandonedAt:
          type: [string, "null"]
          format: date-time
        convertedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
